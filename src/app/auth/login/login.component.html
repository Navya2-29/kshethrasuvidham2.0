<app-spinner *ngIf="loading"></app-spinner>
<main class="main">
    <div class="content">
      <div class="left-side">
       <!-- <mat-slide-toggle>Toggle me!</mat-slide-toggle> -->
       
      </div>
     
      <!-- <div class="divider" role="separator" aria-label="Divider"></div> -->
      <div class="right-side">
        <img src="assets/images/logo.jpg">
        <h2>Counter Login</h2>
        <form [formGroup]="loginForm">
        <div>
          <small *ngIf="errorMessage" class="text-danger">{{errorMessage}}</small>
            <mat-form-field appearance="outline">
              <mat-label>Enter your Login ID</mat-label>
              <input matInput placeholder="" autofocus formControlName="username">
              <mat-icon matSuffix>supervised_user_circle</mat-icon>
              <!-- <mat-hint>Hint</mat-hint> -->
            </mat-form-field>
          </div>
           <div>
            <mat-form-field appearance="outline">
              <mat-label>Enter your password</mat-label>
              <input matInput [type]="hide ? 'password' : 'text'" formControlName="password">
              <button mat-icon-button matSuffix >
                <!-- <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon> -->
              </button>
              
            </mat-form-field>
           
           </div>  
          <button mat-raised-button type="submit" style="background-color: maroon;color:orange;" (click)="submitLogin(loginForm.value)">Login</button>
          </form>
       </div>
    </div>
  </main>
