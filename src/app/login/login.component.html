
<main class="main">
    <div class="content">
      <div class="left-side">
       <!-- <mat-slide-toggle>Toggle me!</mat-slide-toggle> -->
       
      </div>
     
      <!-- <div class="divider" role="separator" aria-label="Divider"></div> -->
      <div class="right-side">
        <img src="assets/images/logo.jpg">
        <h2>Counter Login</h2>
        <div>
            <mat-form-field appearance="outline">
              <mat-label>Enter your Login ID</mat-label>
              <input matInput placeholder="" autofocus>
              <mat-icon matSuffix>supervised_user_circle</mat-icon>
              <!-- <mat-hint>Hint</mat-hint> -->
            </mat-form-field>
          </div>
           <div>
            <mat-form-field appearance="outline">
              <mat-label>Enter your password</mat-label>
              <input matInput [type]="hide ? 'password' : 'text'">
              <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
              </button>
            </mat-form-field>
           </div>  
          <a routerLink="/dashboard" mat-raised-button style="background-color: maroon;color:orange;">Login</a>
       </div>
    </div>
  </main>
