
<app-header></app-header>
<app-spinner></app-spinner>
<div class="amster">
    <div class="container">
     <div class="card-body outlook" style="background:white;">
            <div class="posback">
                <a routerLink="/dashboard" class="back">&nbsp;&nbsp;<mat-icon title="Edit" style="color:white;">arrow_back_ios</mat-icon></a>
                <h1 class="tname">Guruvayurappan Temple</h1>
            </div>
            <div class="master">
                <div class="col-md-4">
                    <h1 style="font-weight:500;">Member Master</h1>
                    <form >
                    <table class="table">
                        <tr>
                           <td> Name<input type="text"  class="form-control sps" placeholder="Enter Code"> </td>
                           
                           
                         </tr>
                         
                         <tr>
                           <td colspan="3"> Address 1<input  type="text" class="form-control" placeholder="Enter Name"> </td>
                         </tr>
                         <tr>
                            <td colspan="3"> Address 2<input  type="text" class="form-control" placeholder="Enter Name"> </td>
                          </tr>
                          <tr>
                            <td colspan="3"> Address 3<input  type="text" class="form-control" placeholder="Enter Name"> </td>
                          </tr>
                          <tr>
                            <td colspan="3"> Phone<input  type="text" class="form-control" placeholder="Enter Name"> </td>
                          </tr>
                        
                          <tr>
                            <td colspan="3"> Mobile<input  type="text" class="form-control" placeholder="Enter Name"> </td>
                          </tr>  
                          <tr>
                            <td colspan="3"> Email<input  type="text" class="form-control" placeholder="Enter Name"> </td>
                          </tr>   
                         <tr>
                           <td><button class="btn btn-primary" >save</button> 
                            <!-- <button class="btn btn-primary" 
                   >update</button> -->
                            <button class="btn btn-secondary" >cancel</button></td>
                         </tr>
                       </table>
                      </form>
                </div>
                <div class="col-md-8 search">
                  
                    <div class="fixitems prathishta">
                        <div class="family" >
                          <form [formGroup]="dynamicForm">
                            <div formArrayName="fields">
                              <div *ngFor="let field of fields.controls; let i=index" [formGroupName]="i" class="form-group">
                                <label for="name">Name:</label>
                                <input type="text" formControlName="name"><br><br>
                          
                                <label for="star">Star:</label>
                                <select formControlName="star">
                                  <option value="aswathy">Aswathy</option>
                                  <option value="barany">Barany</option>
                                </select><br><br>
                          
                                <label for="relation">Relation:</label>
                                <input type="text" formControlName="relation"><br><br>
                          
                                <button type="button" (click)="removeField(i)">Remove</button>
                                <br><br>
                              </div>
                            </div>
                            <button type="button" (click)="addField()">Add Field</button>
                          </form>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</div>
