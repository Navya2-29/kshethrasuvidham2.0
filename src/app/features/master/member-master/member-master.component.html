<app-header></app-header>
<app-spinner *ngIf="loading"></app-spinner>
<div class="amster">
  <div class="container">
    <div class="card-body outlook" style="background:white;">
      <div class="posback">
        <a (click)="gotoDashBoard()" class="back">&nbsp;&nbsp;<mat-icon title="Edit"
            style="color:white;" routerLink="/dashboard" >arrow_back_ios</mat-icon></a>
        <h1 class="tname">{{templeName}}</h1>
      </div>
      <div class="master">
        <div class="col-md-9" style="background:rgba(98, 6, 202, .1); border-radius: 15px; height: 70vh;" >
          <!-- [ngStyle]="{'overflow-y': dynamicRows.length > 5 ? 'scroll' : 'hidden'}" -->
          <h1 style="font-weight:500;">Devotee Master</h1>
          <form [formGroup]="memeberForm">
          <div class="row">
            <div class="col-md-4">
              <table class="table">
                <tr>
                  <td> Name<input formControlName="name" type="text" class="form-control sps" placeholder="Enter Code"> </td>

                  <td></td>
                </tr>

                <tr>
                  <td colspan="3"> Address <input formControlName="address1" type="text" class="form-control" placeholder="Enter Name"> </td>
                </tr>
                <!-- <tr>
                  <td colspan="3"> Address 2<input type="text" formControlName="address2" class="form-control" placeholder="Enter Name"> </td>
                </tr> -->
                <tr>
                  <td colspan="3"> Mobile<input type="text" formControlName="mobile" class="form-control" placeholder="Enter Name"> </td>
                </tr>
                <tr>
                  <td colspan="3"> Email<input type="email" formControlName="email" class="form-control" placeholder="Enter Name"> </td>
                </tr>
              </table>
            </div>
            <div class="col-md-8">
              <table class="table">
                    <div formArrayName="relativesDetails">
                      <tr  *ngFor="let devotee of relativesDetails.controls; let i = index" [formGroupName]="i" >
                        <td ><a  color="accent"><mat-icon class="icons" (click)="removeDevotee(i)">delete</mat-icon></a></td>
                        <td><input  formControlName="Name" type="text" placeholder="Enter Name" style="border:none;"></td>
                        <td>
                          <select class="form-control" formControlName="Star" style="width:100%;height:30.6px;">
                            <option>Select Star</option>
                            <option *ngFor="let nakshtra of nakshatham " [value]="nakshtra.id"> {{nakshtra.SM_NameEng}}</option>
                          </select>
                        </td>
                      
                        <td style="vertical-align:center;" >
                          <mat-icon class="icons" (click)="addRelativeDetails()" style="color: blue;">add_comment</mat-icon>
                        </td>
                      </tr>
                    </div>
              </table>
              <table style="border: none;">
                <tr>
                  <td></td>
                  <td colspan="3"><button class="btn btn-success mt-8" (click)="onSubmit(memeberForm.value)">save</button>
                    <!-- <button class="btn btn-primary" 
                  >update</button> -->
                    <button class="btn btn-danger ml-4" (click)="resetForm()" >cancel</button>
                    <!-- <button class="btn btn-primary ml-4">Edit</button> -->
                    <button class="btn btn-danger ml-4" (click)="onUpdate(memeberForm.value)">Update</button>
                  </td>
                </tr>
              </table>
            </div>
          </div>
        </form>
          
        </div>
        <div class="col-md-3 search">

          <div class="fixitems prathishta">
            <div>
              <div>
                <button class="btn btn-info" (click)="printMemberslist()">Memers list</button>
              </div>
              <div style="padding:0px;margin-bottom:18px; margin-top: 20px;">
                <table class="table">
                  <tr>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Mobile</th>
                    <th>
                    </th>
                  </tr>
                  <tr *ngFor="let member of memberList">
                    <td>{{member.MID}}</td>
                    <td>{{member.Name}}</td>
                    <td>{{member.mobile}}</td>
                    <td> 
                      <!-- <a href="#" color="accent"><mat-icon class="icons">add_comment</mat-icon></a><br/> -->
                      <mat-icon title="Edit" class="small" style="vertical-align: middle;" (click)="onEdit(member)"
                     >edit</mat-icon>
                    <mat-icon title="Delete" class="small" style="vertical-align: middle;"
                  (click)="onDeleteAll(member.MID)">delete</mat-icon>
                  </td>
                    
                  </tr>
                </table>
              </div>
              <div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
