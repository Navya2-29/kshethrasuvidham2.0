
<app-header></app-header>
<app-spinner></app-spinner>
<div class="amster">
    <div class="container">
     <div class="card-body outlook" style="background:white;">
            <div class="posback">
                <a routerLink="/dashboard" class="back">&nbsp;&nbsp;<mat-icon title="Edit" style="color:white;">arrow_back_ios</mat-icon></a>
                <h1 class="tname">Guruvayurappan Temple</h1>
            </div>
            <div class="master">
                <div class="col-md-4">
                    <h1 style="font-weight:500;">Day Master</h1>
                    <form  [formGroup]="dayMasterForm">
                    <table class="table">
                        <tr>
                           <td> Select Offering<input type="text" formControlName="offeringCode" class="form-control sps" placeholder="Enter Code"> </td>
                         </tr>
                         <tr>
                            <td>Days</td>
                          </tr>
                          <tr>
                            <td ><input type="checkbox"  [checked]="allSelected"></td>
                             <td >Select All</td>
        
                          </tr> 
                          <tr *ngFor="let day of days; let i=index">
                            <td style="margin-left: 50%;"  ><input (change)="onChange($event)" type="checkbox"    [value]="day" name="days"></td>
                             <td style="margin-right: 50%;" >{{day}}</td>
                          </tr>  
                           
                         <tr>
                          <td><button *ngIf="!updateFlag" class="btn btn-primary"
                          (click)="onSubmit(dayMasterForm.value)" >save</button>
                          <button *ngIf="updateFlag" class="btn btn-primary"
                            >update</button>
                          <button class="btn btn-danger ml-1">cancel</button>
                        </td>
                         </tr>
                       </table>
                      </form>
                </div>
                <div class="col-md-8 search">
                  <div style="display:flex;" class="search-container mt-3">
                    <input type="text" class="form-control sps search-input" (input)="onSearch(searchQuery)"
                      placeholder="search by Code or Name" style="width:36%;" [(ngModel)]="searchQuery">
                    <!-- <button class="btn btn-primary" (click)="onSearch(searchQuery)">Search</button> -->
                    <mat-icon class="search-icon" (click)="onSearch(searchQuery)">search</mat-icon>
                  </div>
                    <div class="fixitems prathishta">
                        <table class="table">
                            <tr style="border-bottom: 2px solid #223d61;">
                              <th >Id</th>
                              <th >code</th>
                              <th >Vazhipad Name</th>
                            </tr>
                            <tbody *ngIf="!showNoRecordsMessage &&dayMaster && dayMaster.length > 0">
                              <tr *ngFor="let data of filteredDayMaster ; let i=index">
                                <td style="background-color: #87b6f3;"><input type="Checkbox"
                                  style="vertical-align: middle;width:12px;" checked></td>
                              <td>{{data.id}}</td>
                              <td>{{data.Days}}</td>
                              <td style="text-align:left;">{{data.Vm_Name}}</td>
                              <td>
                                <mat-icon title="Edit" class="small" style="vertical-align: middle;"
                                  (click)="onEdit(data)">edit</mat-icon>
                                <mat-icon title="Delete" class="small" style="vertical-align: middle;"
                                  (click)="onDelete(data.id)">delete</mat-icon>
                              </td>

                              </tr>
                            </tbody>
                            <tfoot>
                              <tr *ngIf="!dayMaster || dayMaster.length === 0 || showNoRecordsMessage">
                                <td colspan="5">
                                  <div style="width: 100%;" class="mt-3">
                                    <h4 class="text-center">No Records found</h4>
                                  </div>
                                </td>
                              </tr>
                            </tfoot>
                            
                              
                          </table>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</div>
