<app-header></app-header>
<app-spinner *ngIf="loading"></app-spinner>
<div class="amster">
  <div class="container">
    <div class="card-body outlook" style="background:white;">
      <div class="posback">
        <a routerLink="/dashboard" class="back">&nbsp;&nbsp;<mat-icon title="Back"
            style="color:white;">arrow_back_ios</mat-icon></a>
        <h1 class="tname">Guruvayurappan Temple</h1>
      </div>
      <div class="master">
        <div class="col-md-4">
          <h1 style="font-weight:500;">User SignUp</h1>
          <form >
            <table class="table">
              <tr>
                <td>  User name<span class="text-danger">*</span>
                  <input type="text" id="PM_Code"  formControlName="PM_Code" maxlength="3" required
                    class="form-control sps" placeholder="Enter username" style="width:126px;">
                </td>
              </tr>
             
              <tr>
                <td>Password<span class="text-danger">*</span><input type="password" matInput
                    formControlName="PM_Name" maxlength="50" class="form-control" placeholder="Enter password" appUpperCase>
                </td>
              </tr>
              <tr>
                <td>Email<span class="text-danger">*</span><input type="email" matInput
                    formControlName="PM_RegName" class="form-control" placeholder="enter email"> </td>
              </tr>
              
              
              <tr>
                
                    <td>mobile<span class="text-danger">*</span><input type="text" matInput
                        formControlName="PM_RegName" class="form-control" placeholder="enter mobile"> 

                    </td>
                </tr>

                <tr>
                
                    <td>Address<span class="text-danger">*</span><input type="text" matInput
                        formControlName="PM_RegName" class="form-control" placeholder="enter address"> 

                    </td>
                </tr>
                <tr>
                    <td>Role<span class="text-danger">*</span>
                        <select formControlName="PM_RegName" class="form-control" matInput>
                            <option>Staff</option>
                            <option>Admin</option>
                        </select>
                    </td>
                </tr>
                <tr><td>
                 <button  class="btn btn-primary" >Save</button>
                  <button class="btn btn-secondary ml-1">Cancel</button>
                </td>
              </tr>
            </table>
          </form>
        </div>
        <div class="col-md-6 search">
          <div style="display:flex;" class="search-container mt-3">
            <input type="text" class="form-control sps search-input" 
              placeholder="search by Code or Name" style="width:36%;">
            <mat-icon class="search-icon" >search</mat-icon>
          </div>
          <div class="fixitems prathishta" >
            <table class="table">

                <thead  style="border-bottom: 2px solid #223d61;">
                <!-- <th>Id</th> -->
                <th>name</th>
                <th>email</th>
                <th>mobile</th>
                <th></th>
            </thead>
              <tbody >
                <tr>
                  <!-- <td contenteditable="">{{data.PM_ID}}</td> -->
                  <td style="text-align: left;padding-left: 20px;"></td>
                  <td style="text-align:left;"></td>
                 
                    <td><mat-icon title="Edit" class="small" style="vertical-align: middle;"
                     >edit</mat-icon>
                    <mat-icon title="Delete" class="small" style="vertical-align: middle;"
                      >delete</mat-icon>
                  </td>
                </tr>
              </tbody>
              <tfoot>
                <tr >
                  <td colspan="5">
                    <div style="width: 100%;" class="mt-3">
                      <h4 class="text-center">No Records found</h4>
                    </div>
                  </td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
        <div class="col-md-2"
          style="background-image:url('assets/images/login-bg.jpg');background-size:cover;background-position:center;border-radius:0px 15px 15px 0px;">
        </div>
      </div>
    </div>
  </div>
</div>
