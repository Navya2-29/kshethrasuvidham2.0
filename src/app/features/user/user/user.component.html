<app-header></app-header>
<app-spinner *ngIf="loading"></app-spinner>
<div class="amster">
  <div class="container">
    <div class="card-body outlook" style="background:white;">
      <div class="posback">
        <a (click)="gotoBack()" class="back">&nbsp;&nbsp;<mat-icon title="Back"
            style="color:white;">arrow_back_ios</mat-icon></a>
        <h1 class="tname">{{templeName}}</h1>
      </div>
      <div class="master">
        <div class="col-md-4 fixitems">
          <h1 style="font-weight:500;">User SignUp</h1>
          <form  [formGroup]="userForm">
            <table class="table"  >
              <tr>
                <td>  User name<span class="text-danger">*</span>
                  <input type="text" id="username"  formControlName="username" required
                    class="form-control sps" placeholder="Enter username" style="width:126px;">
                </td>
              </tr>
              <div
                *ngIf="pmasterFormFormControl['username'].invalid && (pmasterFormFormControl['username'].dirty || pmasterFormFormControl['username'].touched)"
                class="pl-1 text-danger">
                <div *ngIf="pmasterFormFormControl['username'].hasError('required')">
                  Name is required.
                </div>
                <div *ngIf="pmasterFormFormControl['username'].hasError('duplicateName')" class="text-danger">
                  Name already exists.
                </div>
                
              </div>
              <tr>
                <td>Password<span class="text-danger">*</span><input type="password" matInput
                    formControlName="password" maxlength="50" class="form-control" placeholder="Enter password" appUpperCase>
                </td>
              </tr>
              <tr>
                <td>Email<span class="text-danger">*</span><input type="email" matInput
                    formControlName="email" class="form-control" placeholder="enter email"> </td>
              </tr>
              
              
              <tr>
                
                    <td>mobile<span class="text-danger">*</span><input type="text" matInput
                        formControlName="mobile" class="form-control" placeholder="enter mobile"> 

                    </td>
                </tr>

                <tr>
                
                    <td>Address<span class="text-danger">*</span><input type="text" matInput
                        formControlName="Address1" class="form-control" placeholder="enter address"> 

                    </td>
                </tr>
                <tr>
                    <td>Role<span class="text-danger">*</span>
                        <select formControlName="Role" class="form-control" matInput>
                          <option value="">Select a option</option>
                            <option value="staff">Staff</option>
                            
                        </select>
                    </td>
                </tr>
                <tr>
                  <td>
                    <input
                      type="checkbox"
                      formControlName="Active"
                    />&nbsp;&nbsp; Active
                  </td>
                </tr>
                <tr><td>
                 <button *ngIf="!updateFlag" class="btn btn-primary" (click)="onSubmit()" >Save</button>
                 <button *ngIf="updateFlag" class="btn btn-primary" (click)="onUpdate()" >Update</button>
                  <button class="btn btn-secondary ml-1" (click)="reset()">Cancel</button>
                </td>
              </tr>
            </table>
          </form>
        </div>
        <div class="col-md-6 search">
          <div style="display:flex;" class="search-container mt-3">
            <input type="text" class="form-control sps search-input" (input)="onSearch()" 
              placeholder="search by Name or Mobile" style="width:36%;" [(ngModel)]="searchQuery">
            <mat-icon class="search-icon"  (click)="onSearch()" >search</mat-icon>
          </div>
          <div class="fixitems prathishta" >
            <table class="table">

                <thead  style="border-bottom: 2px solid #223d61;">
                <!-- <th>Id</th> -->
                <th>name</th>
                <th>email</th>
                <th>mobile</th>
                <th>Role</th>
                <th></th>
            </thead>
              <tbody >
                <tr *ngFor=" let item of filteredUmaster">
                  <!-- <td contenteditable="">{{data.PM_ID}}</td> -->
                  <td style="text-align: left;padding-left: 20px;">{{item.UName}}</td>
                  <td style="text-align:left;">{{item.UEmailId}}</td>
                  <td style="text-align:left;">{{item.Umobile}}</td>
                  <td style="text-align:left;">{{item.Role}}</td>
                    <td><mat-icon title="Edit" class="small" style="vertical-align: middle;"
                    (click)="onEdit(item)" >edit</mat-icon>
                    <mat-icon title="Delete" class="small" style="vertical-align: middle;" (click)="onDelete(item.UId)"
                      >delete</mat-icon>
                  </td>
                </tr>
              </tbody>
              <tfoot>
                <tr *ngIf="!staffList || staffList.length ===0 " >
                  <td colspan="5">
                    <div style="width: 100%;" class="mt-3">
                      <h4 class="text-center">No Records found</h4>
                    </div>
                  </td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
        <div class="col-md-2"
          style="background-image:url('assets/images/login-bg.jpg');background-size:cover;background-position:center;border-radius:0px 15px 15px 0px;">
        </div>
      </div>
    </div>
  </div>
</div>
