<div class="card-body" style="background: white">
    <button
      class="btn btn-secondary rounded-circle back-btn"
      title="Go Back"
    >
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div class="row">
      <div class="col-md-5">
        <h2 style="margin-left: 100px">{{"FeeCollection"|translate }}</h2>
        <div >
          <table class="table">
            <tr>
                <td>
                  <label for="ItemValue">Mobile Number</label>
                  <input
                    type="text"
                    id="ItemValue"
                    formControlName="ItemValue"
                    placeholder="Mobile"
                    class="form-control sps"
                  />
                </td>
                <td>
                    <label for="ReceiptAmount">Member Id</label>
                    <input 
                      type="text" 
                      id="ReceiptAmount" 
                      formControlName="ReceiptAmount" 
                      placeholder="Member id" 
                      class="form-control sps">
                  </td>
                <td>
                  <!-- <button class="btn btn-primary">Save</button> -->
                </td>
              </tr>
            <tr>
              <td >
                <label for="ReceiptAmount">Bill No</label>
                <input
                  type="text"
                  [placeholder]="'PLACEHOLDER.BILLNUMBER' | translate"
                  formControlName="BillNo"
                  readonly
                  class="form-control sps"
                />
              </td>
              <td >
                <label>Item</label>
                <select
                  class="form-control"
                  formControlName="NMId"
                  style="width: 100%; height: 30.6px"
                >
                  <option selected value="">Select item</option>
                </select>
              </td>
            </tr>
            <tr>
              <td colspan="2">
                <input
                  type="text"   
                  [placeholder]="'PLACEHOLDER.NAME' | translate"
                  formControlName="Name"
                  class="form-control sps"
                />
              </td>
            </tr>
            <tr>
              <td colspan="2"> 
                <textarea
                [placeholder]="'PLACEHOLDER.ADDRESS' | translate"
                  formControlName="Address"
                  class="form-control sps"
                  rows="5"
                ></textarea>
              </td>
            </tr>
            <tr>
              <td>
                <label>Select Month</label>
                <mat-select [formControl]="toppings" multiple style="background: rgb(226, 225, 225);">
                    @for (topping of toppingList; track topping) {
                      <mat-option [value]="topping">{{topping}}</mat-option>
                    }
                </mat-select>
              </td>
              <!-- <td><input type="checkbox">&nbsp;&nbsp;Kanikka</td> -->
              <td >
                <label>Select Year</label>
                <select
                  class="form-control"
                style="width: 100%;" 
                >
                  <option value="">Select Year</option>
                </select>
              </td>
            </tr>
            <tr>
                <td>
                    <input
                    type="text"
                    placeholder="Amount"
                    class="form-control sps"
                  />
                </td>
                <td>
                    <input
                    type="text"
                    placeholder="Total Amount"
                    class="form-control sps"
                  />
                </td>
            </tr>
            <tr>
              <td>
                <label>Upi id</label>
                <input
                  type="text"
                  formControlName="Remarks" 
                  class="form-control sps"
                />
              </td>
              <td>
                <label>Payment</label>
                <select
                  class="form-control"  
                  style="width: 100%; height: 30.6px"
                >
                  <!-- <option value="">Select Payment mode</option> -->
                  <option value="CS">Cash</option>
                  <option value="UP">UPI</option>
                </select>
              </td>
              <td>
                <button class="btn btn-primary" >Save</button>
                <button  class="btn btn-danger ml-2">
                  Cancel
                </button>
              </td>
            </tr>
          </table>
        </div>
      </div>
      <div class="col-md-7 search">
        <div style="display: flex" >
          <input
            type="text"
            formControlName="searchBillNO"
            class="form-control sps"
            placeholder="search by Bill No."
            style="width: 25%"
          />
          <button class="btn btn-primary" >Search</button>
        </div>
        <div class="fixitems">
          <table class="table">
            <tr style="border-bottom: 2px solid #223d61">
              <th>Sl No.</th>
              <th>Date</th>
              <th>Receipt No.</th>
              <th>Name</th>
              <th>Item</th>
              <th>Weight</th>
              <th></th>
            </tr>
            <tr>
              <td>i</td>
              <td class="left"></td>
              <td class="left"></td>
              <td class="left"></td>
              <td class="left"></td>
              <td></td>
              <td>
              <span
                ><mat-icon
                  title="Cancel bill"
                  class="small"
                  >delete</mat-icon
                ></span
              >
              <span  title="Duplicate Print" class="material-icons small" >print</span>
            </td>
            </tr>
          </table>
        </div>
      </div>
    </div>
  </div>
