<div class="bottom" style="font-family: Manjari">
  <div class="total">
    <div class="col-md-2">
      <div class="btmsearch">
        <div class="btnserachrow">
          <input
            type="text"
            [placeholder]="'PLACEHOLDER.BILLNUMBER' | translate"
            [(ngModel)]="billNumber"

            class="phone"
          />
          <button
            class="btn btn-primary"
            (click)="onFindBillNumber()"
            style="
              padding: 5px;
              border-radius: 0px;
              font-size: 9pt;
              background: #223d61;
              border-radius: 3px;
              border: none;
            "
          >
            Find
          </button>
        </div>
        <div class="btnserachrow">
          <input
            type="text"
            [placeholder]="'PLACEHOLDER.MOBILENUMBER' | translate"
            [(ngModel)]="mobileNumber"
            (ngModelChange)="updateMobile($event)"
            class="phone"
          />
          <button
            class="btn btn-secondary"
            (click)="getNameAndStarByMobilenumber()"
            style="padding: 5px; font-size: 9pt; background-color: #223d61"
          >
            Find
          </button>
        </div>
        <div class="membercheckboxclass">
          <input
            type="checkbox"
            [(ngModel)]="memberDevoteeCheck"
            style="margin-top: 5px"
          /><span style="color: black">{{ "Member" | translate }}</span>
          <button
            (click)="onFind()"
            class="btn btn-secondary"
            style="padding: 5px; font-size: 9pt; background-color: #223d61 ;max-width:120px"
          >
            Devotee Details
          </button>
        </div>
      </div>
    </div>
    <div class="col-md-2">
      <div class="amttoday">

          <p class="amountdisplay" style="font-weight: 800">{{ "TODAYCOLLECTION" | translate }}</p>
          <p class="amountdisplay" style="font-size: 12pt; font-weight: 800;">
            Rs. {{ (todayCollection ? todayCollection : 0) | number : "1.2-2" }}
          </p>
          <p class="lastbillnumber" style="border: 1px solid silver; padding: 5px">
            {{ "LastBillNo" | translate }}.
            <span style="color: #3f51b5; font-weight: 800" *ngIf="!isLockedShow"
              >{{ theLastBillNo }}
            </span>
            <span
              style="color: red; font-weight: 800; font-size: 16px"
              class="blink"
              *ngIf="isLockedShow"
              >LOCK
            </span>
            <span
              (click)="vazhipadUnblocking()"
              style="color: rgb(53, 250, 46); font-weight: 800; font-size: 16px"
              title="Unlock"
              *ngIf="isLockedShow"
            >
              <i class="fa-solid fa-unlock"></i>
            </span>
          </p>

      </div>
    </div>
    <div class="col-md-5">
      <form [formGroup]="customerdetailsForBillingForm">
        <div class="row">
          <!-- Column 1: Address -->
          <div
           [ngClass]="['CS', 'CR'].includes(customerdetailsForBillingForm.get('Trnsmode')?.value) ? 'col-md-6' : 'col-md-4'"
            style="display: flex; flex-direction: column; gap: 6px"
          >
            <span class="gthm"
              ><input
                type="text"
                matInput
                class="form-control phone gothram"
                formControlName="Address3"
                [matAutocomplete]="autoGothram"
                placeholder="{{ 'PLACEHOLDER.ADDRESS3' | translate }}"
                (keydown)="handleKeyDowns($event, 0, 0)"
              />
              <mat-autocomplete #autoGothram="matAutocomplete">
                <mat-option
                  *ngFor="let gothram of filteredGothrams | async"
                  [value]="gothram.GC_Name"
                >
                  {{ gothram.GC_Name }}
                </mat-option>
              </mat-autocomplete>
              <!-- </mat-form-field> -->
            </span>
            <input
              type="text"
              formControlName="Address1"
              [placeholder]="'PLACEHOLDER.ADDRESS1' | translate"
              class="form-control phone"
              #address2
              (keydown)="handleKeyDowns($event, 1, 0)"
            />
            <input
              type="text"
              formControlName="Address2"
              [placeholder]="'PLACEHOLDER.ADDRESS2' | translate"
              class="form-control phone"
              #address3
              (keydown)="handleKeyDowns($event, 2, 0)"
            />
          </div>
          <!-- Column 2: Contact -->

          <div
            [ngClass]="['CS', 'CR'].includes(customerdetailsForBillingForm.get('Trnsmode')?.value) ? 'col-md-6' : 'col-md-4'"
            style="display: flex; flex-direction: column; gap: 8px"
          >
            <input
              type="text"
              formControlName="Mobile"
              maxlength="11"
              [placeholder]="'PLACEHOLDER.PHONE' | translate"
              class="form-control phone"
              #phone
              (keydown)="handleKeyDowns($event, 1, 1)"
              [class.is-invalid]="
                customerdetailsForBillingForm.get('Mobile')?.invalid &&
                customerdetailsForBillingForm.get('Mobile')?.touched
              "
              (input)="mobileSignal.set($any($event.target).value)"
            />

            <input
              type="email"
              formControlName="Email"
              [placeholder]="'PLACEHOLDER.EMAIL' | translate"
              class="form-control phone"
              #email
              (keydown)="handleKeyDowns($event, 2, 1)"
            />
            <input
              type="text"
              formControlName="Pincode"
              [placeholder]="'PLACEHOLDER.PINCODE' | translate"
              class="form-control phone"
              #pincode
              (keydown)="handleKeyDowns($event, 0, 1)"
            />
          </div>

          <!-- Column 3: Cheque & Bank -->
          <div
            *ngIf="!['CS', 'CR'].includes(customerdetailsForBillingForm.get('Trnsmode')?.value)"
            class="col-md-4"
            style="display: flex; flex-direction: column; gap: 8px"
          >
            <input
              type="text"
              *ngIf="
                customerdetailsForBillingForm.get('Trnsmode')?.value != 'CS'
              "
              formControlName="Instno"
              [placeholder]="'PLACEHOLDER.CHEQUENO' | translate"
              class="form-control phone"
              [class.is-invalid]="
                customerdetailsForBillingForm.get('Instno')?.invalid &&
                customerdetailsForBillingForm.get('Instno')?.touched
              "
            />
            <input
              type="date"
              *ngIf="
                customerdetailsForBillingForm.get('Trnsmode')?.value === 'CH'
              "
              formControlName="InstaDate"
              placeholder="Enter cheque date"
              class="form-control phone"
              [class.is-invalid]="
                customerdetailsForBillingForm.get('InstaDate')?.invalid &&
                customerdetailsForBillingForm.get('InstaDate')?.touched
              "
            />
            <input
              type="text"
              *ngIf="
                customerdetailsForBillingForm.get('Trnsmode')?.value === 'CH'
              "
              formControlName="InstBank"
              [placeholder]="'PLACEHOLDER.BANKNAME' | translate"
              class="form-control phone"
              [class.is-invalid]="
                customerdetailsForBillingForm.get('InstBank')?.invalid &&
                customerdetailsForBillingForm.get('InstBank')?.touched
              "
            />
          </div>
        </div>
      </form>
    </div>
    <div class="col-md-3">
      <form [formGroup]="customerdetailsForBillingForm">
        <div style="display: flex; flex-direction: column; max-width: 100%">
          <div style="max-width: 90%;margin-bottom: 0.3em;">
           <input
              type="text"
              formControlName="Givenamount"
              placeholder="Enter Amount"
              style="max-width:50%"

            /> <span style="color:black;margin-left: 3px;max-width: 50%;">Balance:{{balancecalculated}}</span></div>
          <div style="max-width: 90%">
            <select
              class="form-control"
              formControlName="Trnsmode"
              #paymentDropdown
              (change)="onPaymentModeChange($event)"
              style="max-width: 80%"
            >
              <option value="CS">{{ "Cash" | translate }}</option>
              <option value="UP">{{ "UPI" | translate }}</option>
              <option value="DE">{{ "Debit" | translate }}</option>
              <option value="CR">{{ "Credit" | translate }}</option>
              <option value="CH">{{ "Cheque" | translate }}</option>
              <option value="MO">{{ "Money order" | translate }}</option>
              <option value="ON">{{ "PLACEHOLDER.BANK" | translate }}</option>
              <!-- <option value="EN">{{"Endowment" | translate}}</option> -->
            </select>
          </div>
          <div
            style="
              display: flex;
              flex-direction: column;
              align-items: start;
              text-align: left;
              gap: 5px;
              margin-left: 10px;
              margin-bottom: 20px;
              flex-grow: 1;
              margin-right: 0;
              max-width: 90%;
            "
          >
           <!-- <div >
  <input
    type="checkbox"
   formControlName="isDonation"
    id="donationCheck"
  />
  <label for="donationCheck " style="font-weight: 500;">
    Donation Receipt
  </label>
</div> -->
            <div style="display: flex; align-items: center; gap: 10px">
              <button
                style="
                  font-size: 24pt;
                  background-color: #f4f5f7;
                  color: purple;
                  font-weight: 500;
                  border: none;
                  white-space: nowrap;
                  padding: 15px 0px 0px 0px;
                  margin-top:3px;
                  min-width:100px;
                 max-width:160px;

                  text-overflow: ellipsis;
                  overflow: hidden;
                  box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.3);
                "
              >
                {{ totalAmount }}
              </button>

              <!-- &#8377; -->
              <button
                [disabled]="
                  role == 'admin' ||
                  role == 'audit' ||
                  role == 'super' ||
                  receiptPrinrservice.isSubmitting()
                "
                (focus)="onPayFocus()"
                (blur)="onPayBlur()"
                id="paybutton"
                #payButton
                (click)="onSubmit()"
                style="
                  font-size: 12pt;
                  background-color: #223d61;
                  color: white;
                  font-weight: 500;
                  border: none;
                  padding: 8px 20px;
                  cursor: pointer;
                  min-width: 80px;
                  max-width: 120px;
                  margin-right: 20px;
                "
              >
                {{
                  receiptPrinrservice.isSubmitting() ? "Processing..." : "Pay"
                }}
              </button>
            </div>
          </div>

          <!-- <button class="btn btn-primary" (click)="" style="font-size:12pt;background-color:#046ef8;color:white;font-weight:500;width:auto;border:none;margin-bottom:30px;">pdf</button> -->
        </div>
      </form>
    </div>
  </div>
</div>
