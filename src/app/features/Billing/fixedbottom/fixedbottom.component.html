<div class="bottom">
    <div class="total">
        <div class="col-md-2">
            <div class="btmsearch">
                    <div >
                        <input   type="text" placeholder="Search by Bill Number" style="width:150px;"> 
                        <button class="btn btn-primary" style="padding:5px;border-radius:0px;font-size:9pt;background: #223d61;border-radius:3px;border:none;">Find
                        </button>
                    </div>
                    <div>
                        <input  type="text" placeholder="Search by Mob Number" [(ngModel)]="mobileNumber"  style="width:150px;"> 
                        <button  class="btn btn-secondary"  (click)="onFind()" style="padding:5px;font-size:9pt;background-color:#223d61;">Find</button>
                    </div>
            </div>
        </div>
        <div class="col-md-2">
            <div class="amttoday">
                <div style="display:flex;align-items:center;justify-content:center;flex-direction:column;column-gap:0px;">
                    <p style="font-weight:800;">Collection - Today</p>
                    <p style="font-size:12pt;font-weight:800;margin-top:-9px;">Rs. 123456789</p>
                    <p style="border:1px solid silver;padding:5px;">Last Bill No. <span style="color:#3f51b5;font-weight:800;">{{LastBillNo}} </span></p>
                </div>
                
            </div>
        </div>
            <div class="col-md-3">
                <form [formGroup]="customerdetailsForBillingForm">
                <div class="amttotal">
                    <div style="display:flex;flex-direction:column;align-items: center; gap:6px;flex-wrap: wrap;">
                       <input type="text" formControlName="Address1"  placeholder="Enter Address1" class="form-control phone">
                       <input type="text" formControlName="Address2" placeholder="Enter Address2" class="form-control phone">
                       <input type="text" formControlName="Address3" placeholder="Enter Address3" class="form-control phone">
                      
                       <input type="text" formControlName="Pincode" placeholder="Enter pincode" class="form-control phone">
                    </div>
                    <div style="display:flex;flex-direction:column;align-items: center; gap:6px;flex-wrap: wrap;">
                        <input type="text" formControlName="Instno" placeholder="DD/Cheque/UPI Number" class="form-control phone">
                        <input type="text" formControlName="Mobile"  placeholder="Enter Phone Number" class="form-control phone">
                        
                        <input type="email" formControlName="Email" placeholder="Enter email" class="form-control phone">
                       
                     </div>
                     <div style="display:flex;flex-direction:column;align-items: center; gap:6px;flex-wrap: wrap;" *ngIf="customerdetailsForBillingForm.get('Trnsmode')?.value === 'cheque'">
                        
                        <input type="text" formControlName="Instno" placeholder="Enter Inst No" class="form-control phone">
                        <input type="date" formControlName="Instdate" placeholder="Enter cheque date" class="form-control phone">
                        <input type="text" formControlName="InstBank" placeholder="Enter Bank Name" class="form-control phone">
                     </div>
                     <div style="display:flex;flex-direction:column;gap:0px;">
                        <div class="method" style="padding-top:35px;">
                            <h5 style="color:white;line-height:9pt;">Select Payment</h5>
                            <select class="form-control" formControlName="Trnsmode" style="width:100%;height:30.6px;padding-left:5px;padding-top:0px;padding-bottom:0px;">
                               <option  value="cs">Cash</option>
                                <option value="upi">UPI</option>
                                <option value="debit">Debit Card</option>
                                <option value="credit">Credit</option>
                                <option value="cheque">Cheque</option>
                            </select>
                        </div>
                        <button class="btn btn-primary" (click)="onSubmit()" style="font-size:12pt;background-color:#046ef8;color:white;font-weight:500;width:auto;border:none;margin-bottom:30px;"><span style="padding:5px;border:0px solid maroon;margin-right:5%;background:white;border-radius:5px;box-shadow:0px 0px 8px white inset;color:black; ">&#8377; {{totalAmount}}</span >Pay</button>
                    </div>

                </div>
            </form>
            </div>
            <div class="col-md-4">
                
            </div>
    </div>
</div>
