<div class="row nowrap">
  <div class="col-md-12">
    <div class="card-body fixitems" id="details">
      <div style="display: flex; flex-wrap: wrap">
        <form [formGroup]="form">
          <table class="table">
            <thead>
              <tr style="background: #223d61; color: white">
                <td style="width: 2%"></td>
                <th style="width: 14%">Vazhipad</th>
                <th style="width: 8%">Name</th>
                <th style="width: 8%">Star</th>
                <th style="width: 8%">Diety</th>
                <th style="width: 2%; text-align: center">Qty</th>
                <th style="width: 4%; text-align: center">Rate</th>
                <th style="width: 4%; text-align: center">Amount</th>
                <th style="width: 9%; text-align: center">Date</th>
                <th style="width: 6%; text-align: center">To Date</th>
                <td style="width: 7%; text-align: center">Single/Multi</td>
                <th style="width: 10%; text-align: center">Time</th>
                <!-- <th> Name 2</th>
                <th>Star 2</th> -->
                <th></th>
                <th></th>
              </tr>
            </thead>
            <tbody formArrayName="vazhipadinfo">
              <tr
                *ngFor="let row of vazhipadinfo.controls; let i = index"
                [formGroupName]="i"
              >
                <td style="padding: 10px">
                  <a (click)="removeRow(i)">
                    <mat-icon>delete</mat-icon>
                  </a>
                </td>
                <td style="display: none">
                  <input type="text" formControlName="Slno" [value]="i" />
                </td>

                <td>
                  <input
                    type="text"
                    placeholder="Select vazhipad"
                    matInput
                    class="form-control sps"
                    formControlName="Vazhipad"
                    [matAutocomplete]="auto"
                    
                  />
                  <mat-autocomplete
                    autoActiveFirstOption
                    #auto="matAutocomplete"
                    (optionSelected)="onSelect($event, i)"
                  >
                    <mat-option
                      *ngFor="let option of filteredOptions[i]"
                      [value]="option.VM_Name"
                    >
                      {{option.VM_Code}}-{{ option.VM_Name }}
                    </mat-option>
                  </mat-autocomplete>
                 
                </td>
                <td>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Enter Name"
                    formControlName="Name"
                  />
                 
                </td>
                <td>
                  <select
                    formControlName="Star"
                    class="form-control"
                    style="width: 100%; height: 30.6px"
                  >
                    <option *ngFor="let item of nakshatham" [value]="item.id">
                      {{ item.name }}
                    </option>
                  </select>
                 
                </td>
                <td>
                  <select
                    class="form-control"
                    formControlName="Prethista"
                    style="width: 100%; height: 30.6px"
                  >
                    <option *ngFor="let prathishta of prathishtaOptions[i]" [value]="prathishta.name" >{{prathishta.name}}</option>
                    
                  </select>
                 
                </td>
                <td style="vertical-align: middle; text-align: center">
                  <input
                  [min]="1"
                    type="number"
                    class="form-control"
                    placeholder="Qty"
                    formControlName="Qty"
                
                  />
                  
                </td>
                <td style="vertical-align: middle; text-align: center">
                  <input
                    type="text"
                    appNumber
                    placeholder="Rate"
                    class="form-control"
                    formControlName="Rate"
                    [readOnly]="row.get('ratechange')?.value ==='N'"
                    [min]="1"
                  />                 
                </td>
                <td style="vertical-align: middle; text-align: center">
                  <input
                    type="text"
                    placeholder="Amount"
                    class="form-control"
                    formControlName="Amount"
                    readonly
                  />
                </td>
                <td style="vertical-align: middle; text-align: center">
                  <input
                    type="date"
                    class="form-control sps"
                    formControlName="VazhipadDate"
                    [readOnly]="row.get('booking')?.value ==='N'"
                    [min]="dateToSet"
                    style="width: 100px;"
                  />
                </td>
                <td style="vertical-align: middle; text-align: center">
                  <input
                    type="text"
                    class="form-control sps"
                  formControlName="toDate"
                    readonly

                  
style="width: 100px;"
                  />
                </td>
                <td style="text-align: center; vertical-align: middle">
                  <input
                    type="radio"
                    name="singleMulti_{{ i }}"
                    value="s"
                  
                    checked
                  /><span style="margin-left: 5px">S</span>
                  <input
                 
                    type="radio"
                    name="singleMulti_{{ i }}"
                    value="m"
                   
                    (click)="openMultiDayDialog(i)"
                    style="padding: 5px; font-size: 9pt"
                  />
                  <span style="margin-left: 5px">M</span>
                </td>
                <td>
                  <select
                    class="form-control"
                    formControlName="time"
                    style="width: 80%; height: 30.6px"
                    (keypress)="handleTimeFieldKeyPress($event, row,i)"
                  >
                    <option *ngFor="let time of vazhipadtime" [value]="time.id">{{time.name}}</option>
                    
                  </select>
                </td>
                <td
                  [ngStyle]="{
                    display:
                      row.get('multiname')?.value === 'Y' ? 'block' : 'none'
                  }"
                >
                  <input
                    type="text"
                    class="form-control"
                    style="width: 60px"
                    formControlName="Name2"
                    placeholder="Name 2"
                  />
                </td>
                <td
                  [ngStyle]="{
                    display:
                      row.get('multiname')?.value === 'Y' ? 'block' : 'none'
                  }"
                >
                <select
                formControlName="Star2"
                class="form-control"
                style="width: 100%; height: 30.6px"
              >
                <option *ngFor="let item of nakshatham" [value]="item.id">
                  {{ item.name }}
                </option>
              </select>
                </td>
                <td>
                  <a (click)="addRow(i)">
                    <mat-icon><span class="icons">add_comment</span></mat-icon>
                  </a>
                </td>
                <td  *ngIf="multidayBooking[i]">
                  <a color="accent" (click)="openMultiDayBookedDetails(i)"
                    ><mat-icon
                      class="icons"
                      style="color: #223d61; cursor: pointer"
                      >more</mat-icon
                    ></a
                  >
                </td>
              </tr>
            </tbody>
          </table>
        </form>
      </div>
    </div>
  </div>
</div>
