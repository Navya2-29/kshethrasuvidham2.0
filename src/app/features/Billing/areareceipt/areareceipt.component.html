<div class="row nowrap">
  <div class="col-md-12">
    <div class="card-body fixitems" id="details">
      <div style="display: flex; flex-wrap: wrap">
        <form [formGroup]="form" (ngSubmit)="save()">
          <table class="table">
            <thead>
              <tr style="background: #223d61; color: white">
                <td style="width: 2%"></td>
                <th style="width: 18%">Vazhipad</th>
                <th style="width: 12%">Name</th>
                <th style="width: 8%">Star</th>
                <th style="width: 8%">Dietee</th>
                <th style="width: 4%; text-align: center">Qty</th>
                <th style="width: 7%; text-align: center">Rate</th>
                <th style="width: 7%; text-align: center">Amount</th>
                <th style="width: 9%; text-align: center">Date</th>
                <th style="width: 10%; text-align: center">Time</th>
                <th></th>
              </tr>
            </thead>
            <tbody formArrayName="rows">
              <tr *ngFor="let row of formArray.controls; let i = index" [formGroupName]="i">
                <td style="padding: 10px">
                  <a (click)="removeRow(i)" *ngIf="i > 0">
                    <mat-icon>delete</mat-icon>
                  </a>
                </td>
                <td>
                    <select formControlName="vazhipad" class="form-control sps" style="width: 100%;height: 33px;">
                      <option *ngFor="let option of VMList" [value]="option.VM_Name">
                        {{ option.VM_Name }}
                      </option>
                    </select>
                    <div *ngIf="row.get('vazhipad')?.invalid && row.get('vazhipad')?.touched">
                      <small class="text-danger">Vazhipad is required</small>
                    </div>
                </td>
                <td>
                  <input
                    type="text"
                    formControlName="name"
                    class="form-control"
                    placeholder="Enter Name"
                  />
                </td>
                <div *ngIf="row.get('name')?.invalid && row.get('name')?.touched">
                  <small class="text-danger">Name is required</small>
                </div>
                <td>
                  <select
                    formControlName="star"
                    class="form-control"
                    style="width: 100%; height: 30.6px"
                  >
                    <option [value]="item.id" *ngFor="let item of nakshatham">
                      {{ item.name }}
                    </option>
                  </select>
                </td>
                <td>
                  <select
                    formControlName="dietee"
                    class="form-control"
                    style="width: 100%; height: 30.6px"
                  >
                   <option *ngFor="let diety of prathishta" [value]="diety.PM_Name">{{ diety.PM_Name }}</option> 
                   </select> 
                </td>
                <td style="vertical-align: middle; text-align: center">
                  <input
                    type="number"
                    formControlName="qty"
                    class="form-control"
                    placeholder="Qty"
                    [min]="1"
                    style="vertical-align: middle; text-align: center"
                  />
                </td>
                <td style="vertical-align: middle; text-align: center">
                  <input type="number" class="form-control spsr" [readonly]="!row.get('rateChangeable')?.value"  formControlName="rate" />
                {{row.get('rateChangeable')?.value}}
                </td>
                <td style="vertical-align: middle; text-align: center">
                  <input type="number" class="form-control spsr" readonly formControlName="amount" />
                </td>
                <td style="vertical-align: middle; text-align: center">
                  <input
                    type="date"
                    formControlName="date"
                    class="form-control"
                    [min]="bookingFlag?tomarrow:today"
                    style="font-size: 10pt; background: none"
                  />
                </td>
                
                <td>
                  <select 
                    formControlName="time"
                    class="form-control"
                    style="width: 80%; height: 30.6px"
                    (keypress)="handleTimeFieldKeyPress($event, row)"
                  >
                    <option *ngFor="let time of vazhipadtime" [value]="time.id">{{time.name}}</option>
                    
                  </select>
                  
                </td>
                <td>
                  <a (click)="addRow()" *ngIf="i === formArray.length - 1">
                    <mat-icon><span class="icons">add_comment</span></mat-icon>
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </form>
      </div>
    </div>
  </div>
</div>
