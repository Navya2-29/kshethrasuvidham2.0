<div class="row nowrap">
  <div class="col-md-12">
    <div class="card-body fixitems" id="details">
      <div style="display: flex; flex-wrap: wrap">
        <form [formGroup]="form" (ngSubmit)="save()">
          <table class="table">
            <thead>
              <tr style="background: #223d61; color: white">
                <td style="width: 2%"></td>
                <th style="width: 18%">Vazhipad</th>
                <th style="width: 12%">Name</th>
                <th style="width: 8%">Star</th>
                <th style="width: 8%">Dietee</th>
                <th style="width: 4%; text-align: center">Qty</th>
                <th style="width: 7%; text-align: center">Rate</th>
                <th style="width: 7%; text-align: center">Amount</th>
                <th style="width: 9%; text-align: center">Date</th>
                <th style="width: 10%; text-align: center">Time</th>
                <th></th>
              </tr>
            </thead>
            <tbody formArrayName="rows">
              <tr *ngFor="let row of formArray.controls; let i = index" [formGroupName]="i">
                <td style="padding: 10px">
                  <a (click)="removeRow(i)" *ngIf="i > 0">
                    <mat-icon>delete</mat-icon>
                  </a>
                </td>
                <td>
                    <select formControlName="vazhipad">
                      <option *ngFor="let option of VMList" [value]="option.VM_Name">
                        {{ option.VM_Name }}
                      </option>
                    </select>
                </td>
                <td>
                  <input
                    type="text"
                    formControlName="name"
                    class="form-control"
                    placeholder="Enter Name"
                  />
                </td>
                <td>
                  <select
                    formControlName="star"
                    class="form-control"
                    style="width: 100%; height: 30.6px"
                  >
                    <option [value]="item.id" *ngFor="let item of nakshatham">
                      {{ item.name }}
                    </option>
                  </select>
                </td>
                <td>
                  <select
                    formControlName="dietee"
                    class="form-control"
                    style="width: 100%; height: 30.6px"
                  >
                    <option>Select Diety</option>
                    <option>Siva</option>
                    <option>Vishnu</option>
                    <option>Ganapathy</option>
                  </select>
                </td>
                <td style="vertical-align: middle; text-align: center">
                  <input
                    type="number"
                    formControlName="qty"
                    class="form-control"
                    placeholder="Qty"
                    style="vertical-align: middle; text-align: center"
                  />
                </td>
                <td style="vertical-align: middle; text-align: center">
                  <input type="text" class="form-control spsr" formControlName="rate" />
                </td>
                <td style="vertical-align: middle; text-align: center">
                  <input type="text" class="form-control spsr" formControlName="amount" />
                </td>
                <td style="vertical-align: middle; text-align: center">
                  <input
                    type="text"
                    formControlName="date"
                    class="form-control"
                    style="font-size: 10pt; background: none"
                    
                  />
                </td>
                <td>
                  <select
                    formControlName="time"
                    class="form-control"
                    style="width: 80%; height: 30.6px"
                  >
                    <option>രാവിലെ</option>
                    <option>​വൈകുന്നേരം</option>
                  </select>
                </td>
                <td>
                  <a (click)="addRow()" *ngIf="i === formArray.length - 1">
                    <mat-icon><span class="icons">add_comment</span></mat-icon>
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </form>
      </div>
    </div>
  </div>
</div>
