<h2 mat-dialog-title style="background: #223d61; color: white">
  Multi day Booking 
</h2>
<mat-dialog-content class="high" style="width: 100%">
  <div class="container" >
    <div class="row">
      <form>
        <div class="col-md-4">
          <div>
            <div style="padding: 0px; margin-bottom: 18px">
              <table class="">
                <tr><td>Vazhipad</td>
                <td>Name</td>
                    <td>Star</td>
                    <td>Rate</td></tr>
                    <tr>
                      <td><input
                        type="text"
                        class="form-control formdate"
                        placeholder="Vazhipad"
                      /></td>
                      <td><input
                        type="text"
                        class="form-control formdate" 
                        placeholder="Name"
                      /></td>
                      <td><input
                        type="text"
                        class="form-control formdate"
                        placeholder="Star"
                      /></td>
                      <td><input
                        type="text"
                        class="form-control formdate"
                        placeholder="Rate"
                      /></td>
                    </tr>
                  <tr>
                    <th>Starting Date</th>
                    <th>No. of Days</th>
                    <th>Qty</th>
                    <th>End Date</th>
                  </tr>
                  <tr>
                    <td>
                      <input
                        type="date"
                        class="form-control formdate"
                        formControlName="startDate"
                        style="width: 90px" 
                      />
                    </td>
                    <td>
                      <input
                        type="number"
                        class="form-control formdate"
                        
                        formControlName="numberOfDays"
                        [min]="1"
                      />
                    </td>
                    <td>
                      <input
                        type="number"
                        class="form-control formdate"
                        style="width: 60px"
                        readonly
                        formControlName="quantity"
                        [min]="1"
                      />
                    </td>
                    <td>
                      <input
                        type="date"
                        class="form-control formdate"
                        
                        formControlName="endDate"
                        readonly
                      />
                    </td>
                  </tr>
              </table>
            </div>

            <div
              style="
                margin-bottom: 11px;
                width: auto;
                padding: 5px;
                height: auto;
              "
            >
              <button class="btn btn-primary" >
                Add Devotee
              </button>
            </div>
            <div>
              <table class="table">
                <tbody formArrayName="devotees">
                  <tr
                  
                    
                  >
                    <td>
                      <a color="accent"
                        ><mat-icon class="icons" 
                          >delete</mat-icon
                        ></a
                      >
                    </td>
                    <td>
                      <input
                        type="text"
                        [formControlName]="'name'"
                        placeholder="Enter Name"
                        style="border: none"
                      />
                    </td>
                    <td>
                      <select
                        class="form-control select-star"
                        style="width: fit-content; height: 30.6px"
                        [formControlName]="'star'"
                      >
                        <option>Select Star</option>
                        <option>Select Star</option>
                        <option>Aswathy</option>
                        <option>Bharany</option>
                        <option>Makayiram</option>
                        <option>Karthika</option>
                        <option>Thiruvathira</option>
                        <option>Punartham</option>
                        <option>Pooyam</option>
                      </select>
                    </td>
                    <!-- <td style="vertical-align: center">
                        <a (click)="addRow()" color="accent"
                          ><mat-icon class="icons">add_comment</mat-icon></a
                        >
                      </td> -->
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </form>

      <div class="col-md-4">
        <div>
          <table class="table" >
            <thead>
              <tr style="background-color: #223d61; color: white">
                <th colspan="2">Filter Options</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Starvise</td>
                <td>
                  <select>
                    <option>Aswathy</option>
                    <option>Bharani</option>
                    <option>Karthika</option>
                    <option>Rohini</option>
                    <option>Makayiram</option>
                    <option>Thiruvathira</option>
                  </select>
                </td>
              </tr>
              <tr>
                <td style="line-height: 11.7pt">Malayalam Monthwise</td>
                <td>
                  <select>
                    <option>Aswathy</option>
                    <option>Bharani</option>
                    <option>Karthika</option>
                    <option>Rohini</option>
                    <option>Makayiram</option>
                    <option>Thiruvathira</option>
                  </select>
                </td>
              </tr>
              <tr>
                <td>Daywise</td>
                <td>
                  <select>
                    <option>Aswathy</option>
                    <option>Bharani</option>
                    <option>Karthika</option>
                    <option>Rohini</option>
                    <option>Makayiram</option>
                    <option>Thiruvathira</option>
                  </select>
                </td>
              </tr>
              <tr>
                <td style="line-height: 11.7pt">Malayalam Datewise</td>
                <td>
                  <select>
                    <option>Aswathy</option>
                    <option>Bharani</option>
                    <option>Karthika</option>
                    <option>Rohini</option>
                    <option>Makayiram</option>
                    <option>Thiruvathira</option>
                  </select>
                </td>
              </tr>
              <tr>
                <td style="line-height: 11.7pt">English Datewise</td>
                <td>
                  <select>
                    <option>Aswathy</option>
                    <option>Bharani</option>
                    <option>Karthika</option>
                    <option>Rohini</option>
                    <option>Makayiram</option>
                    <option>Thiruvathira</option>
                  </select>
                </td>
              </tr>
              <tr>
                <td style="line-height: 11.7pt"> Thidhi</td>
                <td>
                  <select>
                    <option>Aswathy</option>
                    <option>Bharani</option>
                    <option>Karthika</option>
                    <option>Rohini</option>
                    <option>Makayiram</option>
                    <option>Thiruvathira</option>
                  </select>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="col-md-4">
        <div>
          <table class="table" >
            <thead>
              <tr style="background-color: #223d61; color: white">
                <th colspan="2">Day List</th>
              </tr>
            </thead>
          </table>
        </div>
        <div class="daylist">
          <table class="table" style="width: 100%">
            <tbody>
              <tr >
                <td><input type="checkbox" checked />&nbsp; </td>
              </tr>
              <tr >
                <td>No day found</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions class="menuend">
  <button mat-button [mat-dialog-close]="true" class="close">Cancel</button>
  <button mat-button class="proceed" >Proceed</button>
</mat-dialog-actions>
