<app-header></app-header>
<app-spinner *ngIf="loading"></app-spinner>
<div class="table-container">
  <div *ngFor="let group of groupedData | keyvalue">
    <h2>{{ group.key }}</h2>
    <table class="responsive-table">
      <thead>
        <tr>
          <th>{{"Report Name.SINO" | translate}}</th>
          <th class="amount-column">{{"Report Name.Vazhipad Name" | translate}}</th>
          <th class="code-column">{{"Report Name.Vazhipad Code" | translate}}</th>
          <th class="amount-column" style="text-align: right;">{{"Report Name.Amount" | translate}}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of group.value; let i = index">
          <td>{{ i + 1 }}</td>
          <td class="amount-column">{{ item.VName }}</td>
          <td class="code-column">{{ item.VCode }}</td>
          <td class="amount-column">₹{{ item.VAmount }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
