
<app-header></app-header>

<div class="icon-container">
  <button mat-icon-button matTooltip="Back to previous page" (click)="goBack()">
    <span class="material-icons">arrow_back</span>
</button>
    <button mat-icon-button matTooltip="Make PDF" (click)="generatePDF()">
        <span class="material-icons">print</span>
    </button>
    <!-- <button mat-icon-button matTooltip="Export to Spreadsheet" >
        <span class="material-icons">grid_view</span>
    </button> -->
</div>
<div  >
<div>
  <h3 style="align-items: center;text-align:center;margin-left: 0;padding-top: 0;padding-bottom: 0;margin-bottom: 0; font-family: 'Times New Roman', Times, serif;font-weight:bold;" >{{templeName}}</h3>
  <h4 style="align-items: center;text-align:center;margin-left: 0;padding-top: 0;padding-bottom: 0;margin-bottom: 0; font-family: 'Times New Roman', Times, serif;font-weight:bold;" >{{templeAddress}}</h4>

  <h5 style="align-items: center;text-align:center;margin-left: 0;padding-top: 0;padding-bottom: 0;margin-bottom: 0; font-family: 'Times New Roman', Times, serif;font-weight:bold;" >OFFERING REPORT</h5>
  <p style="align-items: center;text-align: center;padding-top: 0;padding-bottom: 0;margin-bottom: 0; font-family: 'Times New Roman', Times, serif;font-weight:bold;">{{formatDateToDDMMYYYY(fromDate)}} to {{formatDateToDDMMYYYY(toDate)}}</p>

</div>

  <div   class="a4-sheet" >
    <hr style="padding-top: 0;"/>
     <table>
       <thead>
         <tr>
           <th>SI No</th>
         
           <th>Vazhipad</th>
           
           <th>Qty</th>
         
          
         </tr>
       </thead>
       <tbody>
         <tr *ngFor="let item of data; let i=index">
           <td>{{ i+1 }}</td>
          
           <td>{{item.Vazhipad}}</td>
           
           <td style="text-align: right;">{{ item.Qty  }}</td>
           
      
       
          
           
           <!-- <td>{{ item.Remarks }}</td> -->
         </tr>
         <tr *ngIf="data.length<=0">No data found</tr>
       </tbody>
       <tfoot>
         <tr>
           <td  ><strong>Grand Total:</strong></td>
           <td></td>
           <td style="font-weight: bold; text-align: right;">{{ getTotalAmount() | number: '1.2-2' }}</td>
           <!-- <td colspan="2"></td> -->
         </tr>
        
       </tfoot>
     </table>
   </div>
