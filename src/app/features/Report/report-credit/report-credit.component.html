
<app-header></app-header>

<div class="icon-container">
  <button mat-icon-button matTooltip="Back to previous page" (click)="goBack()">
    <span class="material-icons">arrow_back</span>
</button>
    <button mat-icon-button matTooltip="Make PDF" (click)="generatePDF()">
        <span class="material-icons">print</span>
    </button>
    <!-- <button mat-icon-button matTooltip="Export to Spreadsheet" >
        <span class="material-icons">grid_view</span>
    </button> -->
</div>

<div class="report-table">
  <mat-form-field>
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Search data" #input>
  </mat-form-field>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      <ng-container matColumnDef="BillNo">
        <th mat-header-cell *matHeaderCellDef> Bill No </th>
        <td mat-cell *matCellDef="let element"> {{ element.BillNo }} </td>
      </ng-container>

      <ng-container matColumnDef="BillDate">
        <th mat-header-cell *matHeaderCellDef> Bill Date </th>
        <td mat-cell *matCellDef="let element"> {{ element.BillDate }} </td>
      </ng-container>

      <ng-container matColumnDef="Vazhipad">
        <th mat-header-cell *matHeaderCellDef> Vazhipad </th>
        <td mat-cell *matCellDef="let element"> {{ element.Vazhipad }} </td>
      </ng-container>
  
      <ng-container matColumnDef="Name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let element"> {{ element.Name }} </td>
      </ng-container>
  
      <ng-container matColumnDef="Mobile">
        <th mat-header-cell *matHeaderCellDef> Mobile </th>
        <td mat-cell *matCellDef="let element"> {{ element.MobileNo }} </td>
      </ng-container>
  
      <ng-container matColumnDef="Qty">
        <th mat-header-cell *matHeaderCellDef> Qty </th>
        <td mat-cell *matCellDef="let element"> {{ element.Qty }} </td>
      </ng-container>
      <ng-container matColumnDef="Rate">
        <th mat-header-cell *matHeaderCellDef> Rate </th>
        <td mat-cell *matCellDef="let element"> {{ element.Rate }} </td>
      </ng-container>

      <ng-container matColumnDef="Amount">
        <th mat-header-cell *matHeaderCellDef> Amount </th>
        <td mat-cell *matCellDef="let element"> {{ element.Amount }} </td>
      </ng-container>
      <ng-container matColumnDef="TransMode">
        <th mat-header-cell *matHeaderCellDef> TransMode </th>
        <td mat-cell *matCellDef="let element"> {{ element.TrnsMode }} </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <mat-paginator
      [length]="length"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      (page)="onPageChange($event)">
    </mat-paginator>
  </div>
