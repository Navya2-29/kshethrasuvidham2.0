
<app-header></app-header>

<div class="icon-container">
  <button mat-icon-button matTooltip="Back to previous page" (click)="goBack()">
    <span class="material-icons">arrow_back</span>
</button>
    <button mat-icon-button matTooltip="Make PDF" (click)="generatePDF()">
        <span class="material-icons">print</span>
    </button>
    <button mat-icon-button matTooltip="Export to Spreadsheet" >
        <span class="material-icons">grid_view</span>
    </button>
</div>
<h1>Cheque Statement</h1>

<div class="report-table">
  <mat-form-field>
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Search data" #input>
  </mat-form-field>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      <ng-container matColumnDef="BillNo">
        <th mat-header-cell *matHeaderCellDef> Bill No </th>
        <td mat-cell *matCellDef="let element"> {{ element.BillNo }} </td>
      </ng-container>

      <ng-container matColumnDef="Bank Name">
        <th mat-header-cell *matHeaderCellDef> Bank Name </th>
        <td mat-cell *matCellDef="let element"> {{ element.InstBank }} </td>
      </ng-container>

      <ng-container matColumnDef="Vazhipad">
        <th mat-header-cell *matHeaderCellDef> Vazhipad </th>
        <td mat-cell *matCellDef="let element"> {{ element.Vazhipad }} </td>
      </ng-container>
  
      <ng-container matColumnDef="Cheq Date">
        <th mat-header-cell *matHeaderCellDef>Cheq Date</th>
        <td mat-cell *matCellDef="let element"> {{ element.InstDate }} </td>
      </ng-container>
  
      <ng-container matColumnDef="ChqueNo">
        <th mat-header-cell *matHeaderCellDef> ChqueNo </th>
        <td mat-cell *matCellDef="let element"> {{ element.InstNo }} </td>
      </ng-container>
  
      <ng-container matColumnDef="Amount">
        <th mat-header-cell *matHeaderCellDef> Amount </th>
        <td mat-cell *matCellDef="let element"> {{ element.Amount }} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <mat-paginator
      [length]="length"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      (page)="onPageChange($event)">
    </mat-paginator>
  </div>
