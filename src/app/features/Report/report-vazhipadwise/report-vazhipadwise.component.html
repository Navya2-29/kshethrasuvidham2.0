<app-header></app-header>

<div class="icon-container">
  <button mat-icon-button matTooltip="Back to previous page" (click)="goBack()">
    <span class="material-icons">arrow_back</span>
</button>
    <button mat-icon-button matTooltip="Make PDF" (click)="generatePDF()">
        <span class="material-icons">print</span>
    </button>
    <!-- <button mat-icon-button matTooltip="Export to Spreadsheet" >
        <span class="material-icons">grid_view</span>
    </button> -->
</div>
<div><h1 style="align-items: center;text-align: center; font-family: 'Times New Roman', Times, serif;font-weight:bold;">VAZHIPAD WI REPORT</h1></div>

<div class="report-table">
  <mat-form-field>
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Search data" #input>
  </mat-form-field>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="SINo">
        <th mat-header-cell *matHeaderCellDef> SINo </th>
        <td mat-cell *matCellDef="let element; let i = index"> {{ i + 1 }} </td>
      </ng-container>
     

     
      <ng-container matColumnDef="VAZHIPAD">
        <th mat-header-cell *matHeaderCellDef> VAZHIPAD </th>
        <td mat-cell *matCellDef="let element"> {{ element.Vazhipad }} </td>
      </ng-container>
  
     
  
   
  
      <ng-container matColumnDef="QUANTITY">
        <th mat-header-cell *matHeaderCellDef> QUANTITY </th>
        <td mat-cell *matCellDef="let element"> {{ element.TotalQty }} </td>
      </ng-container>
  
     
  
     
  
      
  
    
  
      
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <mat-paginator
      [length]="length"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      (page)="onPageChange($event)">
    </mat-paginator>
  </div>
