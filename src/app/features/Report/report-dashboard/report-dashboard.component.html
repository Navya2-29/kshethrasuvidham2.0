<app-header></app-header>
<app-spinner *ngIf="isloading"></app-spinner>

<div class=" container dashboard-container">
  <div class="row">
  <!-- Left side menu with radio buttons -->
  <div class="left-menu">
    <form [formGroup]="searchForm">
      <div class="radio-group">
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="Poornam"
          />
          All Vazhipad List
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="debit"
          />
          Debit/Credit Card
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="DailyStmt"
          />
          Daily Statement(Transaction)
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="moneyorder"
          />
          Money Order
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="DailyStmtDetaild"
          />
          Daily Statement(Detailed)
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="cheque"
          />
          Cheque Statement
        </label>
       
       
       
        
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="AdvanceBook"
          />
        Advance Booking 
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="credit"
          />
         
          Due/Credit 
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="counter"
          />
          Daily Statement (Counter) 
          <br/>
          <input type="checkbox"  formControlName="countercheckbox" />All Counter
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="upi"
          />
          UPI
        </label>
        
        <!-- <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="report-counter-trnsaction"
          />
          Counter-Transaction 
        </label> -->
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="online"
          />
          Online
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="offering"
          />
          Offering Only
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="cancel"
          />
          Vazhipad Cancel
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="nadavaravu"
          />
          Nadavaravu Booking
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="nadavaravu-cancel"
          />
          Nadavaravu Cancel
        </label>
      </div>
    </form>
  </div>
  
  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; ">
    <form [formGroup]="searchForm">
    <label for="prathishta" >Diety</label>
    <select  class="form-control" style="width: 200px;" formControlName="prathista" id="prathishta">
      <option value="">Select Diety</option>
      <option *ngFor="let item of pmaster" [value]="item.PM_ID" >{{item.PM_Name}}</option>
      </select>
    <label for="Vazhipad">Vazhipad</label>
    <select class="form-control" style="width: 200px;" formControlName="vazhipad" id="prathishta">
      <option value="">Select Vazhipad</option>
      <option *ngFor="let item of Vmaster" [value]="item.VC_ID" >{{item.VM_Name}}</option>
    </select>
  </form>
  </div>
  <!-- Middle section for date inputs with enhanced design -->
  <div class="date-section">
    <div class="date-card">
      <form [formGroup]="searchForm" class="date-form">
        <div class="form-group">
          <label for="from-date">From Date</label>
          <input type="date" id="from-date" formControlName="fromDate" />
        </div>
        <div class="form-group">
          <label for="to-date">To Date</label>
          <input type="date" id="to-date" formControlName="toDate" />
        </div>
      </form>
    </div>
  </div>

 
</div>


</div>


<div class="right-buttons" >
  <button class="action-button" style="background-color: green;" (click)="onSearch()">Search</button><br/>
  <button class="action-button" (click)="onBack()">Back</button>

<!-- </div>
<div class="right-buttons">
  
</div> -->

</div>
