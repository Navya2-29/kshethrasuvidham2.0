<app-header></app-header>
<app-spinner *ngIf="isloading"></app-spinner>

<div class=" container dashboard-container">
  <div class="row">
  <!-- Left side menu with radio buttons -->
  <div class="left-menu">
    <form [formGroup]="searchForm">
      <div class="radio-group">
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="Poornam"
          />
          All Vazhipad List
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="debit"
          />
          Debit
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="DailyStmt"
          />
          Daily Statement (Transaction)
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="moneyorder"
          />
          Money order
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="DailyStmtDetaild"
          />
          Daily Statement (Detailed)
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="cheque"
          />
          Cheque Stmnt
        </label>
       
       
       
        
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="AdvanceBook"
          />
        Advance Booking 
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="credit"
          />
         
          Due details
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="counter"
          />
          Counter
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="upi"
          />
          UPI
        </label>
        
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="report-counter-trnsaction"
          />
          Counter-Trnsaction
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="online"
          />
          Online
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="offering"
          />
          Offering Only
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="cancel"
          />
          Cancel
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="nadavaravu"
          />
          nadavaravu Booking
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="nadavaravu-cancel"
          />
          nadavaravu-cancel
        </label>
      </div>
    </form>
  </div>

  <!-- Middle section for date inputs with enhanced design -->
  <div class="date-section">
    <div class="date-card">
      <form [formGroup]="searchForm" class="date-form">
        <div class="form-group">
          <label for="from-date">From Date</label>
          <input type="date" id="from-date" formControlName="fromDate" />
        </div>
        <div class="form-group">
          <label for="to-date">To Date</label>
          <input type="date" id="to-date" formControlName="toDate" />
        </div>
      </form>
    </div>
  </div>

  <!-- Right side buttons -->
  <div class="right-buttons">
    <button class="action-button" (click)="onSearch()">Search</button>
    
  </div>
  <div class="right-buttons">
    <button class="action-button" (click)="onBack()">Back</button>
    
  </div>

</div>
</div>
