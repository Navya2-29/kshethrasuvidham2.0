<app-header></app-header>
<app-spinner *ngIf="isloading"></app-spinner>

<div class=" container dashboard-container">
  <div class="row">
  <!-- Left side menu with radio buttons -->
  <div class="left-menu">
    <form [formGroup]="searchForm">
      <div class="radio-group">
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="Poornam"
          />
          {{ 'Report.All Vazhipad List' | translate }}
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="debit"
          />
         {{'Report.Debit/Credit Card' | translate }} 
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="DailyStmt"
          />
          {{'Report.Daily Statement(Transaction)' |translate}}
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="moneyorder"
          />
          {{ 'Report.Money Order' | translate}}
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="DailyStmtDetaild"
          />
          {{'Report.Daily Statement (Detailed)' |translate }}
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="cheque"
          />
           {{ 'Report.Cheque Statement' | translate}}
        </label>
       
       
       
        
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="AdvanceBook"
          />
       {{'Report.Advance Booking' |translate}}  
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="credit"
          />
         
         {{ 'Report.Due/Credit' | translate}}  
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="counter"
          />
          {{'Report.Daily Statement (Counter)' | translate}} 
          <br/>
          <input type="checkbox"  formControlName="countercheckbox" />{{'Report.All Counter' | translate}}
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="upi"
          />
         {{ 'Report.UPI' | translate}} 
        </label>
        
        <!-- <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="report-counter-trnsaction"
          />
          Counter-Transaction 
        </label> -->
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="online"
          />
         {{'Report.Online Report' |translate}} 
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="offering"
          />
          {{'Report.Offering Only' | translate}}
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="cancel"
          />
          {{'Report.Vazhipad Cancel' | translate}}
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="nadavaravu"
          />
         {{ 'Report.Nadavaravu Booking' |translate}} 
        </label>
        <label>
          <input
            type="radio"
            formControlName="vazhipadOption"
            value="nadavaravu-cancel"
          />
          {{'Report.Nadavaravu Cancel' | translate }}
        </label>
      </div>
    </form>
  </div>
  
  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; ">
    <form [formGroup]="searchForm">
    <label for="prathishta" >Diety</label>
    <select  class="form-control" style="width: 200px;" formControlName="prathista" id="prathishta">
      <option value="">Select Diety</option>
      <option *ngFor="let item of pmaster" [value]="item.PM_ID" >{{item.PM_Name}}</option>
      </select>
    <label for="Vazhipad">Vazhipad</label>
    <select class="form-control" style="width: 200px;" formControlName="vazhipad" id="prathishta">
      <option value="">Select Vazhipad</option>
      <option *ngFor="let item of Vmaster" [value]="item.VM_Id" >{{item.VM_Name}}</option>
    </select>
  </form>
  </div>
  <!-- Middle section for date inputs with enhanced design -->
  <div class="date-section">
    <div class="date-card">
      <form [formGroup]="searchForm" class="date-form">
        <div class="form-group">
          <label for="from-date">From Date</label>
          <input type="date" id="from-date" formControlName="fromDate" />
        </div>
        <div class="form-group">
          <label for="to-date">To Date</label>
          <input type="date" id="to-date" formControlName="toDate" />
        </div>
      </form>
    </div>
  </div>
</div>

</div>

<div class="right-buttons" >
  <button class="action-button" style="background-color: green;" (click)="onSearch()">{{'Search' |translate}}</button><br/>
  <button class="action-button" (click)="onBack()">{{'Back' |translate}} </button>

<!-- </div>
<div class="right-buttons">
  
</div> -->

</div>
