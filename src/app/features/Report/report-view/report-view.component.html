  <!-- PDF Container -->
  <div id="pdf-content" style="margin-left: 100px; margin-right: 100px;">
    <div style="text-align: center; margin-bottom: 20px;">
      <h1>Vazhipad Report</h1>
      <p>{{ formatDateToDDMMYYYY(fromDate) }} to {{ formatDateToDDMMYYYY(toDate) }}</p>
    </div>
    <div *ngFor="let group of groupedData | keyvalue">
      <h3>{{ group.key }}</h3>
      <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
        <thead>
          <tr>
            <th style="border: 1px solid black; padding: 5px;">Sl No</th>
            <th style="border: 1px solid black; padding: 5px;">Name</th>
            <th style="border: 1px solid black; padding: 5px;">Star</th>
            <th style="border: 1px solid black; padding: 5px;">Qty</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let entry of group.value; let i = index">
            <td style="border: 1px solid black; padding: 5px;">{{ i + 1 }}</td>
            <td style="border: 1px solid black; padding: 5px;">{{ entry.Name }}</td>
            <td style="border: 1px solid black; padding: 5px;">{{ entry.Star }}</td>
            <td style="border: 1px solid black; padding: 5px;">{{ entry.Qty }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
