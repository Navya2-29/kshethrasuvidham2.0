
<app-header></app-header>

<div class="icon-container">
  <button mat-icon-button matTooltip="Back to previous page" (click)="goBack()">
    <span class="material-icons">arrow_back</span>
</button>
    <button mat-icon-button matTooltip="Make PDF" (click)="generatePDF()">
        <span class="material-icons">print</span>
    </button>
    <button mat-icon-button matTooltip="Export to Spreadsheet" >
        <span class="material-icons">grid_view</span>
    </button>
</div>
<div><h1 style="align-items: center;text-align: center; font-family: 'Times New Roman', Times, serif;font-weight:bold;">UPI TRANSACTION REPORT</h1></div>

<div class="report-table">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      <ng-container matColumnDef="BillNo">
        <th mat-header-cell *matHeaderCellDef> Bill No </th>
        <td mat-cell *matCellDef="let element"> {{ element.BillNo }} </td>
      </ng-container>

      <ng-container matColumnDef="UPI-ID">
        <th mat-header-cell *matHeaderCellDef> UPI-ID </th>
        <td mat-cell *matCellDef="let element"> {{ element.InstNo }} </td>
      </ng-container>

      <ng-container matColumnDef="Vazhipad">
        <th mat-header-cell *matHeaderCellDef> Vazhipad </th>
        <td mat-cell *matCellDef="let element"> {{ element.Vazhipad }} </td>
      </ng-container>
      <ng-container matColumnDef="NAME">
        <th mat-header-cell *matHeaderCellDef> NAME </th>
        <td mat-cell *matCellDef="let element"> {{ element.Name }} </td>
      </ng-container>
  
      <ng-container matColumnDef="STAR">
        <th mat-header-cell *matHeaderCellDef> STAR</th>
        <td mat-cell *matCellDef="let element"> {{ element.Star }} </td>
      </ng-container>
      <ng-container matColumnDef="QTY">
        <th mat-header-cell *matHeaderCellDef> QTY </th>
        <td mat-cell *matCellDef="let element"> {{ element.Qty }} </td>
      </ng-container>
      <ng-container matColumnDef="RATE">
        <th mat-header-cell *matHeaderCellDef> RATE </th>
        <td mat-cell *matCellDef="let element"> {{ element.Rate }} </td>
      </ng-container>
  
      <ng-container matColumnDef="Amount">
        <th mat-header-cell *matHeaderCellDef> Amount </th>
        <td mat-cell *matCellDef="let element"> {{ element.Amount }} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <mat-paginator
      [length]="length"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      (page)="onPageChange($event)">
    </mat-paginator>
  </div>
