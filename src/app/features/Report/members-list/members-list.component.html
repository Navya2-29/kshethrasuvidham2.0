  <h4 style="align-items: center;text-align:center;margin-left: 0;padding-top: 0;padding-bottom: 0;margin-bottom: 0; font-family: 'Times New Roman', Times, serif;font-weight:bold;" >{{templeAddress}}</h4>

<div style="margin-left: 30px;margin-right: 30px;">
    
    
          <table border="1">
            <thead>
              <tr>
                <th>{{"SI No"| translate}}</th>
                <th>{{"Member Id"| translate }}</th>
                <th>{{"Name"| translate}}</th>
                <th>{{"Address" | translate }}</th>
                <th>Mobile</th>
                <th>Email</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let memeber of data;let i=index" >
                <td>{{i+1}}</td>
                <td>{{memeber.MID}}</td>
                <td >{{memeber.Name}}</td>
                <td >{{memeber.Address}}</td>
                <td >{{memeber.mobile}}</td>
                <td>{{memeber.email}}</td>
              </tr>
            
            
            </tbody>
