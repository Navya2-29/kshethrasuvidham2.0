<div class="dialog-container">
    <h2 mat-dialog-title>Welcome!</h2>
    <p class="dialog-message">
      Please enter your Counter ID to continue.
    </p>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Counter ID</mat-label>
      <input matInput placeholder="Enter Counter ID" [(ngModel)]="counterId" type="number"  (keydown.enter)="save()"/>
    </mat-form-field>
    <div class="dialog-actions">
      <button mat-flat-button color="primary" class="custom-button" (click)="save()">Submit</button>
    </div>
  </div>
