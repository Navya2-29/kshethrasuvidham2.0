<!-- ================= MOBILE HEADER ================= -->
<div class="mobile-header">
  <div class="menu-card">
    <app-menu></app-menu>
  </div>

  <div class="mobile-title">
    {{ templeName }}
  </div>

  <button class="icon-btn" (click)="logout()">
    <mat-icon>logout</mat-icon>
  </button>
</div>

<!-- ================= DESKTOP HEADER ================= -->
<div class="desktop-header">

  <div class="header-container">

    <!-- LEFT SECTION -->
    <div class="header-left">

      <button class="back-btn" (click)="goBack()">
        <img src="assets/images/back.png" />
      </button>

      <div class="center-block">
        <div class="counter">Counter : {{ counterId }}</div>

        <div class="menu-card">
          <app-menu></app-menu>
        </div>

        <!-- <div class="version">Version 1.0</div> -->
      </div>

      <div class="logo-box">
        <a routerLink="/Home">
          <img [src]="getlogo()" />
        </a>
      </div>

      <div class="temple-name">
        {{ templeName }}
      </div>

    </div>

    <!-- RIGHT SECTION -->
    <div class="header-right">

      <div class="date-card">
        <div class="date-box">
          <p>
            {{ today }}<br />
            <span>{{ day }}</span>
          </p>
        </div>

        <div class="date-box">
          <p>
            {{ mdate }}<br />
            <span>{{ nal }}</span>
          </p>
        </div>
      </div>

      <div class="external-logo">
        <a href="https://kshethrasuvidham.com/" target="_blank">
          <img src="assets/images/logo.jpg" />
        </a>
      </div>

      <div class="user-section">
        <button mat-icon-button [matMenuTriggerFor]="menu" class="user-btn">
          <mat-icon>supervisor_account</mat-icon>
        </button>

        <mat-menu #menu="matMenu">
          <button mat-menu-item>
            <mat-icon>supervisor_account</mat-icon>
            <span>{{ userName }}</span>
          </button>

          <button mat-menu-item (click)="openChangepasswordDialog()">
            <mat-icon>settings</mat-icon>
            <span>Change Password</span>
          </button>

          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
          </button>
        </mat-menu>
      </div>

    </div>

  </div>

</div>
