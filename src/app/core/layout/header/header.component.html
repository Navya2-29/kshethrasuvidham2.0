
<div class="">
  <div style="width:40px;text-align: center; margin-top:10px;height:50px;background:maroon;position:fixed;top:0;border-radius:50%;align-items:center;justify-conter:center;display:flex;color:white;">
    Back
    </div>
  <div class="">
    
    <div class="" style="display:flex;justify-content: space-between;border:0px solid red;width:100%;align-items:center;padding-left:20px;padding-right:20px;background-image:url('assets/images/banner.png');background-size:cover;height:100px;background-position:center;">
      <div class="">

      </div>

          <mat-menu #menu="matMenu">

            </button>
          </mat-menu>    
        </div>
      </div>
