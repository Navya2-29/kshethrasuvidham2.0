
<h2 mat-dialog-title>{{templeName}} - Counter</h2>
<mat-dialog-content class="high fixitems" >
    <div class="container">
        <div class="row openmenu">
            <div class="col-md-3.5">
                <div class="card">
                    <div class="card-header height" style="background-color:maroon;color:white;height:50px;">
                        <h3>Masters</h3>
                    </div>
                    <div class="card-body">
                       <ul class="list-group list-group-flush">
                        <a 
                *ngFor="let link of masterLinks"
                [routerLink]="role === 'admin' ? link.path : null"
                [class.disabled]="role !== 'admin'"
                [mat-dialog-close]="role === 'admin' ? true : null"
                (click)="onLinkClick($event)"
                [attr.aria-disabled]="role !== 'admin'">
                <li class="list-group-item">{{ link.label }}</li>
              </a>
                      </ul>

                    </div>
                  </div>
            </div>
            <!-- <div class="col-md-3.5">
                <div class="card">
                    <div class="card-header height" style="background-color:maroon;color:white;height:50px;">
                        <h3>Transactions</h3>
                    </div>
                    <div class="card-body">
                      <ul class="list-group list-group-flush">
                        <a href=""><li class="list-group-item">Nadavaravu Details</li></a>
                        <a href=""><li class="list-group-item">Mattinam Vazhipadu Entry</li></a>
                        <a href=""><li class="list-group-item">Credit Collection</li></a>
                        <a href=""><li class="list-group-item">Editing</li></a>
                        <a routerLink="calander" [mat-dialog-close]="true"><li class="list-group-item">Calander</li></a>

                      </ul>

                    </div>
                  </div>
            </div> -->
            <div class="col-md-2.5">
                <div class="card">
                    <div class="card-header height" style="background-color:maroon;color:white;height:50px;">
                        <h3>Reports</h3>
                    </div>
                    <div class="card-body">
                      <ul class="list-group list-group-flush">
                        <a routerLink="getReport" [mat-dialog-close]="true"><li class="list-group-item">Reports</li></a>
                       
                      </ul>

                    </div>
                  </div>
            </div>
            <div class="col-md-2.5">
                <div class="card">
                    <div class="card-header height" style="background-color:maroon;color:white;height:50px;">
                        <h3>Utilities</h3>
                    </div>
                    <div class="card-body">
                      <ul class="list-group list-group-flush">
                        <a routerLink="/mattinagal" [mat-dialog-close]="true"><li class="list-group-item">Nadavarav Booking</li></a>
                        <a  *ngIf="role === 'admin' " routerLink="/userSignup" [mat-dialog-close]="true"><li class="list-group-item">Signup</li></a>
                      </ul>

                    </div>
                  </div>
            </div>
        </div>
    </div>
</mat-dialog-content>


<mat-dialog-actions align="end" class="menuend">
  <!-- <button mat-button mat-dialog-close>Cancel</button> -->
  <button mat-button [mat-dialog-close]="true">Close</button>
</mat-dialog-actions>
