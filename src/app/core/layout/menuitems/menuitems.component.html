<h2 mat-dialog-title class="dialog-title">
  {{ templeName }} - Counter
</h2>

<mat-dialog-content class="fixitems">

  <div class="menu-container">

    <!-- Masters -->
    <div class="menu-box">
      <h3>Masters</h3>

      <ng-container *ngFor="let link of masterLinks; trackBy: trackByLabel">
        <a
          (click)="navigate(link.path)"
          [class.disabled]="role === 'staff'"
        >
          {{ link.label }}
        </a>
      </ng-container>

      <a (click)="navigate('/member-master')">
        Devotee Master
      </a>
    </div>

    <!-- Reports -->
    <div class="menu-box">
      <h3>Reports</h3>

      <a (click)="navigate('getReport')">
        Reports
      </a>
      <a (click)="navigate('panjankam')">
        Panchangam
      </a>
    </div>

    <!-- Utilities -->
    <div class="menu-box">
      <h3>Utilities</h3>

      <ng-container *ngFor="let link of utilityLinks; trackBy: trackByLabel">
        <a
          *ngIf="hasAccess(link)"
          (click)="navigate(link.path)"

        >
          {{ link.label }}
        </a>
      </ng-container>

    </div>

  </div>

</mat-dialog-content>

<mat-dialog-actions align="end" class="menuend">
  <button mat-button [mat-dialog-close]="true">Close</button>
</mat-dialog-actions>
