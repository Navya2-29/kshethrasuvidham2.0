<app-header></app-header>

<main class="main">

  <div class="content">

    <!-- LEFT SIDE -->
    <div class="left-side">
      <div class="temple-details">
        <img [src]="getlogo()" class="temple-image" />
        <h2 class="temple-name">{{ templeName }}</h2>
      </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right-side">

      <p class="version">Version 1.0</p>

      <img src="assets/images/logo.jpg" />

      <div class="dashbord">

        <a routerLink="/dashboard" mat-raised-button class="col-md-12">
          {{ "BILLING" | translate }}
        </a>

        <a routerLink="/getReport" mat-raised-button class="col-md-12">
          {{ "REPORTS" | translate }}
        </a>

        <a routerLink="/mattinagal" mat-raised-button class="col-md-12">
          {{ "MISCELLANEOUS BILLING" | translate }}
        </a>

        <div class="backicon">
          <a (click)="goBack()">
            <img src="assets/images/home.png">
          </a>
        </div>

      </div>

    </div>

  </div>

  <!-- FOOTER -->
   <div>
  <p class="copy-right">
    © Copyright 2025 | Cubix Software Solutions
  </p>


</div>
<div>
  <p class="lastupdate">
    Last Updated on: {{ todayDate | date:'dd MMM yyyy' }}
  </p></div>
</main>
