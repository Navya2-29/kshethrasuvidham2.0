<app-spinner *ngIf="loading"></app-spinner>
<main class="main">
 <div *ngIf="notification" class="alert-banner">
  <mat-icon class="alert-icon">campaign</mat-icon>

  <div class="alert-text-wrapper">
    <span class="alert-text">{{ notification }}</span>
  </div>

  <button mat-icon-button class="close-btn" (click)="notification = ''">
    <mat-icon>close</mat-icon>
  </button>
</div>
  <div class="content">

    <!-- LEFT SIDE -->

    <div class="left-side">
      <div class="temple-details">
        <img [src]="getlogo()" class="temple-image" />
        <h2 class="temple-name">{{ templeName }}</h2>
      </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right-side">
      <p class="version">Version 1.0</p>

      <img src="assets/images/logo.jpg" />

      <h2>Counter Login</h2>

      <form [formGroup]="loginForm">

        <small *ngIf="errorMessage" class="text-danger">
          {{ errorMessage }}
        </small>

        <mat-form-field appearance="outline">
          <mat-label>Enter your Login ID</mat-label>
          <input matInput formControlName="username"
                 (keydown.enter)="focusPassword()" />
          <mat-icon matSuffix>supervised_user_circle</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Enter your password</mat-label>
          <input matInput type="password"
                 formControlName="password"
                 (keydown.enter)="submitLogin(loginForm.value)" />

          <button mat-icon-button matSuffix>
            <mat-icon>
              {{ hide ? 'visibility_off' : 'visibility' }}
            </mat-icon>
          </button>
        </mat-form-field>

        <button mat-raised-button class="submit"
                (click)="submitLogin(loginForm.value)">
          Login
        </button>

      </form>
    </div>

  </div>
  <!-- FOOTER -->
   <div>
  <p class="copy-right">© Copyright 2025 | Cubix Software Solutions</p>
   </div>
  <p class="last-updated">
    Last Updated on: {{ todayDate | date:'dd MMM yyyy' }}
  </p>
</main>
