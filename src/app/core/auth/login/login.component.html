<app-spinner *ngIf="loading"></app-spinner>
<main class="main">
    <div class="content">
      <div class="left-side">
        <div class="temple-details">
          <img [src]=this.logo class="temple-image">
         <h2 class="temple-name">{{templeName}}</h2>
        </div>
       
       
    </div>
    <!-- <div style="width:100%;position:absolute;bottom:0px;margin-bottom:15px;font-size:12.6pt;">
    <p style="color:white;">Version 1.0</p> -->
      <!-- <p style="color:brown;">Last Updated on: {{todayDate | date:'dd MMM yyyy'}}</p> -->
     <!-- </div> --> 
    <p class="copy-right">&#169; Copyright 2025 | Cubix Software Solutions</p>
    <p class="last-updated">Last Updated on: {{todayDate | date:'dd MMM yyyy'}}</p>

      <!-- <div class="divider" role="separator" aria-label="Divider"></div> -->
      <div class="right-side">
        <p class="version">Version 1.0</p>

        <img src="assets/images/logo.jpg">
        <h2>Counter Login</h2>
        <form [formGroup]="loginForm" (keydown.enter)="submitLogin(loginForm.value)">
        <div>
          <small *ngIf="errorMessage" class="text-danger">{{errorMessage}}</small>
            <mat-form-field appearance="outline">
              <mat-label>Enter your Login ID</mat-label>
              <input matInput placeholder="" autofocus formControlName="username">
              <mat-icon matSuffix>supervised_user_circle</mat-icon>
              <!-- <mat-hint>Hint</mat-hint> -->
            </mat-form-field>
          </div>
           <div>
            <mat-form-field appearance="outline">
              <mat-label>Enter your password</mat-label>
              <input matInput [type]="hide ? 'password' : 'text'" formControlName="password">
              <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
              </button>
              
            </mat-form-field>
           
           </div>  
          <button mat-raised-button type="submit" class="submit" (click)="submitLogin(loginForm.value)">Login</button>
          </form>
       </div>
    </div>
  </main>
