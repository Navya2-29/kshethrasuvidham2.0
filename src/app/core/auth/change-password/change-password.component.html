<div class="dialog-container">
  <h2 class="dialog-title">Change Password</h2>

  <form [formGroup]="changepasswordForm" (ngSubmit)="onSubmit()">
    <!-- Old Password -->
    <div class="form-group">
      <label class="form-label" for="oldPassword">Old password*</label>
      <input
        id="oldPassword"
        type="password"
        class="form-input"
        placeholder="Enter old password"
        formControlName="oldPassword"
        [class.is-invalid]="changepasswordForm.get('oldPassword')?.invalid && changepasswordForm.get('oldPassword')?.touched"
        required
      />
      <div
        class="error-text"
        *ngIf="changepasswordForm.get('oldPassword')?.touched && changepasswordForm.get('oldPassword')?.hasError('required')"
      >
        Old password is required
      </div>
      <div
        class="error-text"
        *ngIf="changepasswordForm.get('oldPassword')?.touched && !changepasswordForm.get('oldPassword')?.hasError('required') && changepasswordForm.get('oldPassword')?.hasError('incorrectOldPassword')"
      >
        Incorrect old password
      </div>
    </div>

    <!-- New Password -->
    <div class="form-group">
      <label class="form-label" for="newPassword">New password*</label>
      <input
        id="newPassword"
        type="password"
        class="form-input"
        placeholder="New password*"
        formControlName="newPassword"
        [class.is-invalid]="changepasswordForm.get('newPassword')?.invalid && changepasswordForm.get('newPassword')?.touched"
        required
      />
      <div
        class="error-text"
        *ngIf="changepasswordForm.get('newPassword')?.touched && changepasswordForm.get('newPassword')?.hasError('required')"
      >
        New password is required
      </div>
      <div
        class="error-text"
        *ngIf="changepasswordForm.get('newPassword')?.touched && changepasswordForm.get('newPassword')?.hasError('minlength')"
      >
        New Password must be at least 5 characters
      </div>
      <div
        class="error-text"
        *ngIf="changepasswordForm.hasError('newPasswordSameAsOld') && changepasswordForm.get('newPassword')?.touched"
      >
        New password cannot be same as old password
      </div>
    </div>

    <!-- Confirm Password -->
    <div class="form-group">
      <label class="form-label" for="confirmPassword">Confirm Password*</label>
      <input
        id="confirmPassword"
        type="password"
        class="form-input"
        placeholder="Confirm Password*"
        formControlName="confirmPassword"
        [class.is-invalid]="changepasswordForm.get('confirmPassword')?.touched && (changepasswordForm.get('confirmPassword')?.invalid || changepasswordForm.hasError('passwordMismatch'))"
        required
      />
      <div
        class="error-text"
        *ngIf="changepasswordForm.get('confirmPassword')?.touched && changepasswordForm.get('confirmPassword')?.hasError('required')"
      >
        Confirm password is required
      </div>
      <div
        class="error-text"
        *ngIf="changepasswordForm.hasError('passwordMismatch') && changepasswordForm.get('confirmPassword')?.touched && !changepasswordForm.get('confirmPassword')?.hasError('required')"
      >
        Passwords do not match
      </div>
    </div>

    <!-- Actions -->
    <div class="dialog-actions">
      <button type="button" class="btn-cancel" (click)="onReset()">
        Cancel
      </button>
      <button type="button" class="btn-submit" (click)="onSubmit()">
        Submit
      </button>
    </div>
  </form>
</div>
