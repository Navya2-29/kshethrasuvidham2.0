<div class="dialog-container">
    <h2 mat-dialog-title>Change Password</h2>
    <!-- <p class="dialog-message">Please change your password to continue</p> -->
    <form [formGroup]="changepasswordForm">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Old password</mat-label>
        <input
          matInput
          placeholder="Enter old password"
          formControlName="oldPassword"
          required
        />
        <!-- Show error message based on the form validation -->
        <!-- <mat-error *ngIf="counterId?.hasError('required')">
          Counter ID is required.
        </mat-error>
        <mat-error *ngIf="counterId?.hasError('pattern')">
          Only numeric characters are allowed.
        </mat-error> -->
      </mat-form-field>


      <mat-form-field appearance="outline" class="full-width">
        <mat-label>New password</mat-label>
        <input
          matInput
          placeholder="Enter new password"
          formControlName="newPassword"
          required
        />
        <!-- Show error message based on the form validation -->
        <!-- <mat-error *ngIf="counterId?.hasError('required')">
          Counter ID is required.
        </mat-error>
        <mat-error *ngIf="counterId?.hasError('pattern')">
          Only numeric characters are allowed.
        </mat-error> -->
      </mat-form-field>
    </form>
    <!-- Show additional error message after pressing the Submit button -->
    <!-- <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p> -->
    <div class="dialog-actions">
      
      <button
      mat-flat-button
     
      class="custom-button"
      style="background-color: red;border: none;"
    >
      Cancel
    </button>
    <button
        mat-flat-button
        color="primary"
        class="custom-button ml-3"
       (click)="onSubmit()"
      >
        Submit
      </button>
    </div>
  </div>
