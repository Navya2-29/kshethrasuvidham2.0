<app-header></app-header>
<app-spinner *ngIf="loading"></app-spinner>
<div class="amster">
  <div class="container">
    <div class="card-body outlook" style="background: white">
      <div class="posback">
        <a (click)="gotoDashBoard()" class="back"
          >&nbsp;&nbsp;<mat-icon title="Edit" style="color: white"
            >arrow_back_ios</mat-icon
          ></a
        >
        <h1 class="tname">{{templeName}}</h1>
      </div>
      <div class="master">
        <div class="col-md-5">
          <form [formGroup]="settingsForm">
            <div class="row">
             
                <h1 style="font-weight: 500">Setting Master</h1>
                <table class="table scrollable-table">
                  <tr>
                    <td>
                      Temple Name<span class="text-danger">*</span
                      ><input
                        type="text"
                       
                        formControlName="templeName"
                        class="form-control sps"
                        placeholder="Enter Temple Name"
                        
                      />

                    </td>
                    </tr>
                    <tr>
                    <td >
                      Temple address<span class="text-danger">*</span>
                      <textarea
                        type="text"
                        class="form-control"
                        appUpperCase
                        maxlength="100"
                        formControlName="templeAddress"
                        placeholder="Enter Name"
                      >
                      </textarea>
                     
                    </td>
                  </tr>
                  <tr>
                    <td >Language
                      <span class="text-danger"
                        >*</span
                      ><select
                        type="text"
                        formControlName="language"
                        class="form-control sps"
                        placeholder="Select Language"
                      ><option value="">Select</option>
                      <option value="en">English</option>
                      <option value="ml">Malayalam</option>
                      <option value="tm">Tamil</option>
                      <option value="kn">Kannada</option>
                      <option value="hi">Hindi</option>
                      </select>
                   
                    </td>
                   
                  </tr>
                 
                  <tr>
                    <td >Printer
                      <span class="text-danger"
                        >*</span
                      ><select
                        type="text"
                        formControlName="printer"
                        class="form-control sps"
                        placeholder="Select printer"
                      ><option value="">Select</option>
                      <option value="dotmetrix">Dot Matrix</option>
                      <option value="inkjet">Inkjet Printer</option>
                      <option value="laser">Laser Printer</option>
                      <option value="thermal">Thermal Printer</option>
                      
                      </select>
                   
                    </td>
                   
                  </tr>
                  <tr>
                    <td>
                        Counter
                      <span class="text-danger"
                        >*</span>
                        <input type="number" class="form-control sps"
                        formControlName="printer"
                        placeholder="Enter counter"
                        min="1"
                        >

                    </td>
                  </tr>
                  <tr>
                    <td>
                        Logo
                      <span class="text-danger"
                        >*</span>
                        <input type="file" class="form-control"
                        formControlName="logo"
                        placeholder="Select Logo"
                       
                        >

                    </td>
                  </tr>
                  <tr>
                    <td> <button class="btn btn-primary">Submit</button>
                    
                    <button class="btn btn-danger">Cancel</button></td>
                  </tr>
                
                  
                  
                
                  
                  
                
                  
                </table>
             
             
            </div>
          </form>
        </div>
        <div class="col-md-7">
          <!-- <div style="display: flex" class="search-container mt-3">
           <div
            <input
              type="text"
              class="form-control sps search-input"
             
              placeholder="search by "
              style="width: 60%"
            
            />
           
            <mat-icon class="search-icon" 
              >search</mat-icon
            > <button class="btn btn-info"><a >Vazhipad List</a></button>
          </div> -->
          <div>
            <h2>Temple Details</h2>
          </div>
          <div class="fixitems prathishta">
            <table class="table">
             

              <tbody
                
              >
<tr >
    <td class="settings" >Name</td> <td>sdsds</td>
</tr>
<tr>
    <td class="settings">Adress</td> <td></td>
</tr>
<tr>
    <td class="settings">Logo</td> <td></td>
</tr>
<tr>
    <td class="settings">Conter</td> <td></td>
</tr>
<tr>
    <td class="settings">Prniter</td> <td></td>
</tr>
<tr>
    <td class="settings">Logo</td> <td></td>
</tr>
             
             
             
               
              </tbody>
              <tfoot>
                <tr
                 
                >
                  <td colspan="3">
                    <div style="width: 100%" class="mt-3">
                      <h4 class="text-center">No Records found</h4>
                    </div>
                  </td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
