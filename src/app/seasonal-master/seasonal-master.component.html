<app-header></app-header>
<app-spinner></app-spinner>
<div class="amster">
  <div class="container">
    <div class="card-body outlook" style="background:white;">
      <div class="posback">
        <a routerLink="/dashboard" class="back">&nbsp;&nbsp;<mat-icon title="Edit"
            style="color:white;">arrow_back_ios</mat-icon></a>
        <h1 class="tname">Guruvayurappan Temple</h1>
      </div>
      <div class="master">
        <div class="col-md-4">
          <h1 style="font-weight:500;">Vazhipad Seasonal Booking</h1>
          <form [formGroup]="seasonalBlockingForm">
            <table class="table">
              <tr>
                <td> Vazhipad Code<input type="text" formControlName="VS_code" class="form-control sps"
                    placeholder="Enter Code"> </td>
                <td></td>

              </tr>
              <div
                *ngIf="SeasonalFormControl['VS_code'].invalid && (SeasonalFormControl['VS_code'].dirty || SeasonalFormControl['VS_code'].touched)"
                class="pl-1 text-danger">
                <div *ngIf="SeasonalFormControl['VS_code'].hasError('required')">
                  code is required.
                </div>
              </div>
              <tr>
                <td colspan="3"> Vazhipad Name<input type="text" formControlName="VM_name" class="form-control"
                    placeholder="Enter Name"> </td>
              </tr>

              <div
                *ngIf="SeasonalFormControl['VM_name'].invalid && (SeasonalFormControl['VM_name'].dirty || SeasonalFormControl['VM_name'].touched)"
                class="pl-1 text-danger">
                <div *ngIf="SeasonalFormControl['VM_name'].hasError('required')">
                  Name is required.
                </div></div>
              <tr>
                <td>
                  From date<input type="date" class="form-control sps" formControlName="VS_fromDate">
                 
                </td>
                <td></td>
                <td>To date <br><input type="date" class="form-control sps" formControlName="VS_toDate">
                  <div
                  *ngIf="SeasonalFormControl['VS_toDate'].invalid && (SeasonalFormControl['VS_toDate'].dirty || SeasonalFormControl['VS_toDate'].touched)"
                  class="pl-1 text-danger">
                  <div *ngIf="SeasonalFormControl['VS_toDate'].hasError('required')">
                   <small>To date is required.</small> 
                  </div>
                </div></td>
              </tr>
              <tr>
                <td colspan="3"><button *ngIf="!updateFlag" class="btn btn-primary"
                  (click)="onSubmit(seasonalBlockingForm.value)">save</button>
                <button *ngIf="updateFlag" class="btn btn-primary"
                  (click)="onUpdate(seasonalBlockingForm.value)">update</button>
                <button class="btn btn-danger ml-1" (click)="onReset()">cancel</button>
              </td>
              </tr>
            </table>
          </form>
        </div>
        <div class="col-md-8 search">
          <div style="display:flex;" class="search-container mt-3">
            <input type="text" class="form-control sps search-input" (input)="onSearch(searchQuery)"
              placeholder="search by Code or Name" style="width:36%;" [(ngModel)]="searchQuery">
            <!-- <button class="btn btn-primary" (click)="onSearch(searchQuery)">Search</button> -->
            <mat-icon class="search-icon" (click)="onSearch(searchQuery)">search</mat-icon>
          </div>
          <div class="fixitems prathishta">
            <table class="table">
              <tr style="border-bottom: 2px solid #223d61;">
                <th style="width:10px;background-color: #223d61;color:white;">Active</th>
                <th>Id</th>
                <th>code</th>
                <th style="text-align: left;">Vazhipad Name</th>
                <th>from date</th>
                <th>to date</th>
               
                <th></th>
              </tr>
              <tbody *ngIf="!showNoRecordsMessage &&seasonalMaster && seasonalMaster.length > 0">
                <tr>
                  <td style="background-color: #87b6f3;"><input type="Checkbox" style="vertical-align: middle;width:12px;"
                      checked></td>
                  <td>1</td>
                  <td>1</td>
                  <td style="text-align:left;">Archna</td>
                  <td>12-08-24</td>
                  <td>07-09-24</td>
                  <td>
                    <mat-icon title="Edit" class="small" style="vertical-align: middle;">edit</mat-icon>
                    <mat-icon title="Delete" class="small" style="vertical-align: middle;">delete</mat-icon>
                  </td>
  
                </tr>
              </tbody>
              
              <tfoot>
                <tr *ngIf="!seasonalMaster || seasonalMaster.length === 0 || showNoRecordsMessage">
                  <td colspan="5">
                    <div style="width: 100%;" class="mt-3">
                      <h4 class="text-center">No Records found</h4>
                    </div>
                  </td>
                </tr>
              </tfoot>
              
        
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
