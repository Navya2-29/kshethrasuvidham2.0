<h2 mat-dialog-title class="dialog-title">Confirmation</h2>
<mat-dialog-content class="dialog-content">
  <p class="dialog-message">{{data.message}}</p>
</mat-dialog-content>
<mat-dialog-actions class="dialog-actions">
  <button mat-button color="primary" (click)="onConfirm()"   #okButton (keydown)="handleKeydown($event, 'ok')" >Ok</button>
  <button mat-button (click)="onCancel()" #cancelButton (keydown)="handleKeydown($event, 'cancel')">Cancel</button>
</mat-dialog-actions>
