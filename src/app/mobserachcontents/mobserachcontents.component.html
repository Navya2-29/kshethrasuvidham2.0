
<h2 mat-dialog-title style="background:#223d61;color:white;">Search Result  - 91 XXXXXXXXXX</h2>
<mat-dialog-content class="high">
    <div class="container">
        <div class="row openmenu">
            <div class="col-md-12">
                <div class="">
                    <div class="">
                        <table mat-table [dataSource]="dataSource" >

                            <!-- Checkbox Column -->
                            <ng-container matColumnDef="select">
                              <th mat-header-cell *matHeaderCellDef>
                                <mat-checkbox (change)="$event ? toggleAllRows() : null"
                                              [checked]="selection.hasValue() && isAllSelected()"
                                              [indeterminate]="selection.hasValue() && !isAllSelected()"
                                              [aria-label]="checkboxLabel()">
                                </mat-checkbox>
                              </th>
                              <td mat-cell *matCellDef="let row">
                                <mat-checkbox (click)="$event.stopPropagation()"
                                              (change)="$event ? selection.toggle(row) : null"
                                              [checked]="selection.isSelected(row)"
                                              [aria-label]="checkboxLabel(row)">
                                </mat-checkbox>
                              </td>
                            </ng-container>
                          
                            <!-- Position Column -->
                            <ng-container matColumnDef="position">
                              <th mat-header-cell *matHeaderCellDef> No. </th>
                              <td mat-cell *matCellDef="let element"> {{element.position}} </td>
                            </ng-container>
                          
                            <!-- Vazhipad column-->
                            <ng-container matColumnDef="vazhipad">
                                <th mat-header-cell *matHeaderCellDef> Vazhipad </th>
                                <td mat-cell *matCellDef="let element"> {{element.vazhipad}} </td>
                              </ng-container>
                            
                            <!-- Name Column -->
                            <ng-container matColumnDef="name">
                              <th mat-header-cell *matHeaderCellDef> Name </th>
                              <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                            </ng-container>
                          
                            <!-- Star Column -->
                            <ng-container matColumnDef="star">
                              <th mat-header-cell *matHeaderCellDef> Star </th>
                              <td mat-cell *matCellDef="let element"> {{element.star}} </td>
                            </ng-container>
                          
                            <!-- Diety Column -->
                            <ng-container matColumnDef="diety">
                              <th mat-header-cell *matHeaderCellDef> Diety </th>
                              <td mat-cell *matCellDef="let element"> {{element.diety}} </td>
                            </ng-container>

                            <!-- Qty Column -->
                            <ng-container matColumnDef="qty">
                                <th mat-header-cell *matHeaderCellDef> Qty </th>
                                <td mat-cell *matCellDef="let element"> {{element.qty}} </td>
                              </ng-container>

                               <!-- Rate Column -->
                            <ng-container matColumnDef="rate">
                                <th mat-header-cell *matHeaderCellDef> Rate </th>
                                <td mat-cell *matCellDef="let element"> {{element.rate}} </td>
                              </ng-container>

                              <!-- Amount Column -->
                            <ng-container matColumnDef="amount">
                                <th mat-header-cell *matHeaderCellDef> Amount </th>
                                <td mat-cell *matCellDef="let element"> {{element.amount}} </td>
                              </ng-container>

                              <!-- Time Column -->
                            <ng-container matColumnDef="time">
                                <th mat-header-cell *matHeaderCellDef> Time </th>
                                <td mat-cell *matCellDef="let element"> {{element.time}} </td>
                              </ng-container>
                          
                            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                            <tr mat-row *matRowDef="let row; columns: displayedColumns;"
                                (click)="selection.toggle(row)">
                            </tr>
                          </table>
                    </div>
                  </div>
            </div>
            
            
            
        </div>
    </div>
</mat-dialog-content>


<mat-dialog-actions  class="menuend">
  <button mat-button [mat-dialog-close]="true" class="close">Close</button>
    <button mat-button class="proceed">Proceed</button> 
</mat-dialog-actions>
