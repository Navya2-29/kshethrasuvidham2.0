<div class="card-body" style="background:white;">
    <div class="row">
        <div class="col-md-4">
            <h2>നട വരവ്</h2>
            <div [formGroup]="nadavaravForm"> 
            <table class="table">
                <tr>
                    <td colspan="2">
                        <input type="text" placeholder="Bill No." formControlName="BillNo" readonly class="form-control sps" style="width:150px;">
                    </td>
                    <td>
                       <a (click)="resetForm()"><mat-icon>delete</mat-icon> </a>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <input type="text" 
                        [ngClass]="{ 'is-invalid': nadavaravForm.get('Name')?.invalid && nadavaravForm.get('Name')?.touched }" 
                        placeholder="Name." formControlName="Name"  class="form-control sps">

                    </td>
                    <td>
                        <select class="form-control" formControlName="Star" style="width:100%;height:30.6px;">
                            <option value="">Select Star</option>
                            <option *ngFor="let nakshtra of nakshatham " [value]="nakshtra.id"> {{nakshtra.SM_NameEng}}</option>
                           
                          </select>
                    </td>
                </tr>
                <tr>
                    <td colspan="3">
                        <input type="text" placeholder="Address" formControlName="Address" class="form-control sps">
                    </td>
                </tr>
                <tr>
                    <td colspan="3">
                        <input type="text" placeholder="Description" formControlName="Description" class="form-control sps">
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <select class="form-control" formControlName="NMId" style="width:100%;height:30.6px;"
                        [ngClass]="{ 'is-invalid': nadavaravForm.get('NMId')?.invalid && nadavaravForm.get('NMId')?.touched }" >
                            <option value="">Select Item</option>
                            
                            <option *ngFor="let item of itemMaster" [value]="item.NM_Id"> {{item.NM_Name}}</option>

                           
                          </select>
                    </td>
                    <!-- <td><input type="checkbox">&nbsp;&nbsp;Kanikka</td> -->
                </tr>
                <tr>


                 <td><input type="text" formControlName="Qty" placeholder="Enter qty" class="form-control sps"></td>
                 <td><input type="text" formControlName="weight" placeholder="Enter weight" class="form-control sps"
                    [ngClass]="{ 'is-invalid': nadavaravForm.get('weight')?.invalid && nadavaravForm.get('weight')?.touched }"  
                    ></td>

                    <td>
                        <select class="form-control" formControlName="unit" style="width:100%;height:30.6px;"
                        [ngClass]="{ 'is-invalid': nadavaravForm.get('unit')?.invalid && nadavaravForm.get('unit')?.touched }" 

                        >
                            <option value="">Select Unit</option>
                            <option value="KG">Kg</option>
                            <option value="GM">  Gm</option>
                            <option value="MG"> Mg</option>
                            
                          </select>
                    </td>
                    <!-- <td>
                        Qty (Kg)<input type="number" class="form-control" placeholder="Qty" value="1" style="vertical-align: middle;text-align:center;">
                    </td>
                    <td>
                        Qty (Gm)<input type="number" class="form-control" placeholder="Qty" value="1" style="vertical-align: middle;text-align:center;">
                    </td>
                    <td>
                        Qty (Mg)<input type="number" class="form-control" placeholder="Qty" value="1" style="vertical-align: middle;text-align:center;">
                    </td> -->
                </tr>
                <tr>
                    
                    <td>
                        <input type="text" formControlName="ItemValue" placeholder="Item Value" class="form-control sps">
                    </td>
                    <td>
                        <input type="text" formControlName="Remarks" placeholder="Remark" class="form-control sps">
                    </td>
                    <td>
                        <!-- <button class="btn btn-primary">Save</button> -->
                    </td>
                    
                </tr>
                <tr>
                    <td>
                        <input type="text" formControlName="ReceiptAmount" placeholder=" Receipts Amount" class="form-control sps">
                    </td>
                    <td>
                        <select class="form-control" formControlName="TrnsMode" style="width:100%;height:30.6px;">
                            <option value="">Select Payment mode</option>
                            <option value="CS">Cash</option>
                            <option value="UPI">UPI</option>   
                          </select>
                    </td>
                    <td>
                        <button class="btn btn-primary" (click)="onSubmit()">Save</button>
                    </td>        
                </tr>
            </table>
            </div>
        </div>
        <div class="col-md-8 search">
            <div style="display:flex;" [formGroup]="searchForm">
               
                <!-- <input type="date" formControlName="searchDate"  class="form-control formdate" style="width:15%;"> -->
                <!-- <button class="btn btn-primary" style="margin-right:15px;" (click)="onSearch()">Search</button> -->
                <input type="text" formControlName="searchBillNO"  class="form-control sps" placeholder="search by Bill No." style="width:25%;">
                <button class="btn btn-primary" (click)="onSearch()">Search</button>
           
            </div>
            <div class="fixitems">
                <table class="table">
                    <tr style="border-bottom: 2px solid #223d61;">
                        <th>Sl No.</th>
                        <th>Date</th>
                        <th>Recceipt No.</th>
                        <th>Name</th>
                        <th>Item</th>
                        <th>Qty</th>
                        <th>Receipt_Amt</th>
                        <th></th>
                    </tr>
                   
                    <tr *ngFor="let item of filteredData; let i=index;">
                        <td>{{i+1}}</td>
                        <td>{{item.Billdate | date: 'yyyy-MM-dd'}}</td>
                        <td>{{item.BillNo}}</td>
                        <td>{{item.Name}}</td>
                        <td>{{item.weight}}-{{item.unit}}-</td>
                        <td>{{item.Qty}}</td>
                        <td>{{item.Receipt_Amt}}</td>
                        <mat-icon title="Edit" class="small">edit</mat-icon>
                        <mat-icon title="Delete" class="small">delete</mat-icon>
                    </tr>
                   
                    
    
                </table>
            </div>
            
        </div>
    </div>
    
    
</div>
